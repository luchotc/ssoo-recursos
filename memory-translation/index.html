<title>Paginación y segmentación</title>
<style>
  :root {

  [hidden] { display: none !important; }

  html, body { margin: 0; padding: 0; }

  .grid-table tr.focus td:first-child { box-shadow: inset 3px 0 0 var(--marked); border-radius: 5px 0 0 5px; }

  .grid-table tr.fault td:last-child { border-radius: 0 5px 5px 0; }

  .grid-table tr.gap td { color: var(--muted); font-family: inherit; padding-top: 0; padding-bottom: 0; }

  .frames { display: grid; gap: 5px; }

  .frame {
    position: relative;
    min-width: 0;
    height: 40px;
    border: 1.5px solid var(--line-strong);
    border-radius: 6px;
    background: var(--card);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .frame .index { position: absolute; top: 2px; left: 4px; font-size: 9.5px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
  .frame .label { position: relative; font-size: 11.5px; font-weight: 750; white-space: nowrap; }

  .mem-caption { font-size: 11.5px; color: var(--muted); margin-bottom: 7px; }

  .legend { display: flex; flex-wrap: wrap; gap: 3px 14px; margin-top: 9px; }

  .legend .swatch.os { border-color: var(--ink-soft); background: var(--line); }
  .legend .swatch.unknown { border-color: var(--line-strong); border-style: dashed; background: var(--card); }
  .legend .swatch.tile-used { border-color: var(--ink-soft); background: var(--ink-soft); }
  .legend .swatch.tile-empty { border-color: var(--line-strong); background: var(--card); }

  .strip-wrap { display: flex; flex-direction: column; height: 100%; min-height: 0; }
  .strip { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 220px; border-radius: 6px; }

  .block {
    position: relative;
    min-height: 26px;
    border: 1.5px solid var(--line-strong);
    border-top-width: 0.75px;
    border-bottom-width: 0.75px;
    background: var(--card);
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 2px 9px;
    font-size: 12px;
  }

  .block:first-child { border-top-width: 1.5px; border-radius: 6px 6px 0 0; }

  .block .name { font-weight: 750; white-space: nowrap; }

  .actors { display: flex; flex-direction: column; gap: 7px; }

  .state-pill.RUNNING { color: var(--running-state); border-color: var(--running-state); background: var(--running-state-soft); }

  .state-gloss { margin-left: 8px; font-size: 12px; color: var(--muted); font-weight: 500; }

  .list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 5px; }

  .list li {

    align-items: baseline;

  .step-unit {
    font-size: 11px;
    color: var(--muted);
    background: var(--page);
    border-radius: 5px;
    padding: 2px 7px;
    white-space: nowrap;
  }

  .narration-body {
    padding: 9px 12px 4px;
    flex: 1 1 auto;
    min-height: 113px;
    max-height: 170px;
    overflow-y: auto;
  }

    display: grid;
    grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.1fr) minmax(300px, 0.85fr);
    gap: 6px 18px;
    align-content: start;
  }

  .narration-body.with-extras.no-compare { grid-template-columns: minmax(0, 1fr) minmax(280px, 0.7fr); }
  .narration-body.with-extras.asking { grid-template-columns: minmax(0, 0.9fr) minmax(360px, 1.1fr); }

  .narration-extras { min-width: 0; min-height: 0; overflow-y: auto; }
  .narration-main { min-width: 0; }

  .narration-text { font-size: 15.5px; margin: 0; color: var(--ink); }
  .narration-note { font-size: 13.5px; color: var(--muted); margin: 4px 0 0; }

  .takeaway {
    padding: 7px 11px;
    border: 2px solid var(--ink);
    border-radius: 8px;
    animation: flash var(--fast) ease-out;
  }

  .takeaway .tag, .ask-box .tag {
    display: block;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 800;
    color: var(--muted);
    margin-bottom: 2px;
  }

  .takeaway .line { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }

  .ask-box { padding: 6px 11px 8px; border: 2px solid var(--ink); border-radius: 8px; }
  .ask-box .question { font-size: 14.5px; font-weight: 700; margin: 0; }

  .ask-options { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 7px; }

    font-weight: 620;

  .ask-result .answer.wrong { border-left-color: var(--fault); }
  .ask-result .answer .head { display: block; font-weight: 750; color: var(--ink); }
  .ask-result .answer.wrong .head { color: var(--fault); }
  .ask-result .retry { align-self: flex-start; padding: 3px 10px; font-size: 12.5px; }

  .compare { margin: 7px 0 0; overflow-x: auto; }
  .compare.full { grid-column: 2; grid-row: 1; margin: 0; }
  .compare table { border-collapse: collapse; font-size: 11.5px; line-height: 1.3; }

  .compare tr + tr td { border-top: 1px solid var(--line); }
  .compare td.label { color: var(--muted); }

  .progress-row { display: flex; align-items: center; gap: 10px; padding: 4px 12px 0; }

  .progress-track { flex: 1; height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }

  .progress-fill {
    height: 100%;
    background: var(--running);
    border-radius: 2px;
    transition: transform var(--fast) ease-out;
    transform-origin: left center;
  }

  .progress { font-size: 12px; line-height: 1.2; color: var(--muted); white-space: nowrap; }

  .controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 7px 12px 8px; }

  .controls .big { padding: 7px 16px; font-size: 15px; font-weight: 640; }

  .controls .big.primary { background: var(--running); border-color: var(--running); color: #fff; }
  .controls .big.primary:hover:not([disabled]) { background: #1a45bd; border-color: #1a45bd; }
  .controls .big.primary[disabled] { background: var(--running); border-color: var(--running); }
  .controls .small { padding: 6px 11px; font-size: 13px; }

  .tip {
    font: inherit;
    background: none;
    border: 0;
    padding: 0;
    color: inherit;
    border-bottom: 1px dotted var(--running);
    cursor: help;
    border-radius: 0;
  }

  .tip:hover { border-bottom-style: solid; }

  #tooltip {
    position: fixed;
    z-index: 20;
    max-width: 330px;
    background: var(--ink);
    color: #fff;
    border-radius: 8px;
    padding: 9px 11px;
    font-size: 13px;
    line-height: 1.42;
    box-shadow: 0 6px 20px rgba(16, 21, 29, 0.3);
    display: none;
  }

  #tooltip.open { display: block; animation: flash var(--fast) ease-out; }
  #tooltip .tip-title { font-weight: 700; display: block; margin-bottom: 3px; }

  @keyframes flash {
    from { opacity: 0.35; }
    to { opacity: 1; }
  }

  @media (max-width: 1239px) {
    body { height: auto; overflow: auto; }
    main { grid-template-columns: minmax(0, 1fr) !important; grid-template-rows: none !important; }
    .stack { grid-template-rows: none !important; }
    .panel-body { overflow: visible; }
    .narration-body { overflow: visible; max-height: none; }
    .strip { min-height: 300px; }
  }

  @media (max-width: 1000px) {
    body { padding-bottom: calc(122px + env(safe-area-inset-bottom)); }
    .narration-body.with-extras, .narration-body.with-extras.no-compare, .narration-body.with-extras.asking { grid-template-columns: 1fr; }
    .compare.full { grid-column: auto; grid-row: auto; margin: 7px 0 0; }
    .narration-extras { overflow: visible; }
    .narration-head { flex-direction: column; align-items: flex-start; gap: 3px; }

    .controls {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
      padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
      background: var(--card);
      border-top: 1px solid var(--line-strong);
      box-shadow: 0 -2px 12px rgba(16, 21, 29, 0.08);
      z-index: 10;
    }

    .controls .big, .controls .small { width: 100%; }
    #playPause { display: none; }
    #prevStep { order: 1; }
    #nextStep { order: 2; }
    #firstStep { order: 3; }
    #lastStep { order: 4; }
  }

  @media (max-width: 700px) {
    .ask-options { grid-template-columns: 1fr; }
    .bitline { flex-direction: column; align-items: stretch; gap: 4px; }
    .bitline .track { width: 100%; }
    .bitline .caption { flex: 0 0 auto; padding-top: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>

function fill(template, values) {
  return String(template).replace(/\{(\w+)\}/g, function (whole, key) {
    return values[key] === undefined || values[key] === null ? whole : String(values[key]);

}

function unresolved(text) {
  return /\{\w+\}/.test(String(text));
}

function unbalanced(text) {
  const stars = String(text).split("*").length - 1;
  const opens = String(text).split("[[").length - 1;
  const closes = String(text).split("]]").length - 1;
  return stars % 2 !== 0 || opens !== closes;
}

function power(bits) {
  return Math.pow(2, bits);
}

function slice(value, lowBits, bits) {
  return Math.floor(value / power(lowBits)) % power(bits);
}

function groupThousands(value) {
  const text = String(value);
  if (text.length < 5) return text;
  return text.replace(/\B(?=(\d{3})+(?!\d))/g, ".");

function formatNumber(value, hexDigits) {
  if (value === null || value === undefined) return UI_TEXT.unknownValue;
  if (typeof value === "string") return value;
  if (hexDigits) {
    let text = value.toString(16).toUpperCase();
    while (text.length < hexDigits) text = "0" + text;
    return text + "h";
  }
  return groupThousands(value);
}

function binary(value, bits) {
  let text = value.toString(2);
  while (text.length < bits) text = "0" + text;
  return text;
}

function phaseRank(type, phase) {
  return PHASES[type].indexOf(phase);
}

function tableBlock(columns, roles, rows, extra) {
  return Object.assign({ columns: columns, roles: roles, rows: rows }, extra || {});
}

function pagingMachine(example, address, phase) {
  const machine = example.machine;
  const offsetBits = Math.log2(machine.pageSize);
  const pageBits = machine.logicalBits - offsetBits;
  const frameBits = machine.physicalBits - offsetBits;
  const rank = phaseRank("paging", phase);
  const has = address !== null && address !== undefined;
  const page = has ? Math.floor(address / machine.pageSize) : null;
  const offset = has ? address % machine.pageSize : null;
  const frame = has && page < machine.table.length ? machine.table[page] : null;
  const present = frame !== null && frame !== undefined;
  const lookedUp = has && rank >= 3;
  const composed = has && rank >= 4;
  const fault = lookedUp && !present;
  const physical = present ? frame * machine.pageSize + offset : null;
  const lines = [];
  if (has) {
    lines.push({
      caption: "logical",
      value: address,
      fields: [
        { role: "page", bits: pageBits, value: rank >= 2 ? page : null },
        { role: "offset", bits: offsetBits, value: rank >= 2 ? offset : null }
      ]
    });
    if (fault) {
      lines.push({ kind: "verdict", text: fill(UI_TEXT.verdicts.pageFault, { pagina: page }) });
    } else {
      lines.push({
        caption: "physical",
        value: composed ? physical : null,
        pending: true,
        fields: [
          { role: "frame", bits: frameBits, value: lookedUp ? frame : null },
          { role: "offset", bits: offsetBits, value: lookedUp ? offset : null }
        ]
      });
    }
  }
  const columns = machine.presence ? ["page", "present", "frame"] : ["page", "frame"];
  const roles = machine.presence ? ["page", null, "frame"] : ["page", "frame"];
  const rows = machine.table.map(function (target, index) {
    const frameText = target === null ? UI_TEXT.none : String(target);
    return machine.presence ? [String(index), target === null ? "0" : "1", frameText] : [String(index), frameText];
  });
  const cells = {};
  machine.table.forEach(function (target, index) {
    if (target !== null) cells[target] = { label: fill(UI_TEXT.memory.pageLabel, { n: index }) };
  });
  return {
    views: {
      address: { lines: lines },
      pageTable: { tables: [tableBlock(columns, roles, rows, { highlight: lookedUp && present ? [page] : [], faultRow: fault ? page : null })] },
      memory: { kind: "frames", count: machine.frames, columns: machine.memoryColumns, cells: cells, highlight: lookedUp && present ? [frame] : [] }
    },
    context: { direccion: has ? formatNumber(address) : null, pagina: page, desp: has ? formatNumber(offset) : null, marco: frame, fisica: physical === null ? null : formatNumber(physical) },
    outcome: !lookedUp ? null : (present ? physical : "fault")
  };
}

function segmentBlocks(machine) {
  const ordered = machine.segments.map(function (entry, index) { return { start: entry.base, size: entry.limit, label: "Seg " + index, kind: "seg", index: index }; })
    .sort(function (one, other) { return one.start - other.start; });
  const blocks = [];
  let cursor = 0;
  ordered.forEach(function (block) {
    if (block.start > cursor) blocks.push({ start: cursor, size: block.start - cursor, label: "", kind: "other" });
    blocks.push(block);
    cursor = block.start + block.size;
  });
  if (cursor < machine.memorySize) blocks.push({ start: cursor, size: machine.memorySize - cursor, label: "", kind: "other" });
  return blocks;
}

function segmentMachine(example, address, phase) {
  const machine = example.machine;
  const digits = machine.hexDigits || null;
  const rank = phaseRank("segments", phase);
  const has = address !== null && address !== undefined;
  const pair = Array.isArray(address);
  const segment = !has ? null : (pair ? address[0] : slice(address, machine.offsetBits, machine.segBits));
  const offset = !has ? null : (pair ? address[1] : address % power(machine.offsetBits));
  const entry = has ? machine.segments[segment] : null;
  const within = has && offset < entry.limit;
  const perm = entry && entry.perm ? UI_TEXT.perms[entry.perm] : null;
  const permitted = !machine.access || (perm && perm.allows.indexOf(machine.access) !== -1);
  const physical = has ? entry.base + offset : null;
  const limitChecked = has && rank >= 3;
  const permChecked = has && machine.access && rank >= 4 && within;
  let failure = null;
  if (limitChecked && !within) failure = "segfault";
  else if (permChecked && !permitted) failure = "protection";
  const composed = has && rank >= 5 && !failure;
  const context = {
    direccion: has ? (pair ? "(" + segment + ", " + offset + ")" : formatNumber(address, digits)) : null,
    segmento: segment,
    desp: has ? formatNumber(offset, digits ? 4 : null) : null,
    base: entry ? formatNumber(entry.base, digits) : null,
    limite: entry ? formatNumber(entry.limit, digits ? 5 : null) : null,
    fisica: has ? formatNumber(physical, digits) : null,
    acceso: machine.access ? UI_TEXT.access[machine.access] : null,
    permiso: perm ? perm.label : null
  };
  const lines = [];
  if (has) {
    if (pair) {
      lines.push({ caption: "logical", fields: [{ role: "segment", bits: null, value: segment }, { role: "offset", bits: null, value: offset }] });
    } else {
      lines.push({ caption: "logical", hex: digits, value: address, fields: [{ role: "segment", bits: machine.segBits, value: rank >= 2 ? segment : null }, { role: "offset", bits: machine.offsetBits, value: rank >= 2 ? offset : null }] });
    }
    if (limitChecked) {
      lines.push({ kind: "equation", status: within ? "ok" : "fail", text: fill(within ? UI_TEXT.equations.limit : UI_TEXT.equations.limitFail, context) });
    }
    if (permChecked) {
      lines.push({ kind: "equation", status: permitted ? "ok" : "fail", text: fill(UI_TEXT.equations.perm, context) });
    }
    if (composed) {
      lines.push({ kind: "equation", status: "ok", text: fill(UI_TEXT.equations.sum, context) });
    }
    if (failure === "segfault") lines.push({ kind: "verdict", text: UI_TEXT.verdicts.segfault });
    if (failure === "protection") lines.push({ kind: "verdict", text: fill(UI_TEXT.verdicts.protection, context) });
  }
  const columns = ["segment", "base", "limit"];
  const roles = ["segment", null, null];
  if (machine.access) { columns.push("perms"); roles.push(null); }
  const rows = machine.segments.map(function (item, index) {
    const row = [String(index), formatNumber(item.base, digits), formatNumber(item.limit, digits)];
    if (machine.access) row.push(UI_TEXT.perms[item.perm].label);
    return row;
  });
  const views = {
    address: { lines: lines },
    segmentTable: { tables: [tableBlock(columns, roles, rows, { highlight: has && rank >= 2 && !failure ? [segment] : [], faultRow: failure ? segment : null })] }
  };
  if (machine.memorySize) {
    const blocks = segmentBlocks(machine);
    const memory = { kind: "strip", size: machine.memorySize, unit: digits ? "hex" : "dec", digits: digits, blocks: blocks };
    if (composed || failure === "segfault") {
      const target = blocks.findIndex(function (block) { return physical >= block.start && physical < block.start + block.size; });
      memory.marker = { address: physical, fail: Boolean(failure), label: formatNumber(physical, digits) };
      memory.highlight = target === -1 || failure ? [] : [target];
    }
    views.memory = memory;
  }
  let outcome = null;
  if (failure) outcome = failure;
  else if (composed) outcome = physical;
  return { views: views, context: context, outcome: outcome };
}

function segPagingMachine(example, address, phase) {
  const machine = example.machine;
  const pageSize = power(machine.offsetBits);
  const frameBits = Math.log2(machine.frames);
  const rank = phaseRank("segPaging", phase);
  const has = address !== null && address !== undefined;
  const segment = has ? slice(address, machine.pageBits + machine.offsetBits, machine.segBits) : null;
  const page = has ? slice(address, machine.offsetBits, machine.pageBits) : null;
  const offset = has ? address % pageSize : null;
  const entry = has ? machine.segments[segment] : null;
  const inRange = has && page < entry.table.length;
  const frame = inRange ? entry.table[page] : null;
  const physical = inRange ? frame * pageSize + offset : null;
  const segmentChecked = has && rank >= 3;
  const failure = segmentChecked && !inRange ? "segfault" : null;
  const pageLooked = has && rank >= 4 && !failure;
  const composed = has && rank >= 5 && !failure;
  const context = {
    direccion: has ? formatNumber(address) : null,
    segmento: segment,
    pagina: page,
    desp: has ? formatNumber(offset) : null,
    contenido: entry ? entry.label : null,
    paginas: entry ? entry.table.length : null,
    marco: frame,
    fisica: physical === null ? null : formatNumber(physical)
  };
  const lines = [];
  if (has) {
    lines.push({
      caption: "logical",
      value: address,
      fields: [
        { role: "segment", bits: machine.segBits, value: rank >= 2 ? segment : null },
        { role: "page", bits: machine.pageBits, value: rank >= 2 ? page : null },
        { role: "offset", bits: machine.offsetBits, value: rank >= 2 ? offset : null }
      ]
    });
    if (segmentChecked) {
      lines.push({ kind: "equation", status: inRange ? "ok" : "fail", text: fill(inRange ? UI_TEXT.equations.segPages : UI_TEXT.equations.segPagesFail, context) });
    }
    if (failure) {
      lines.push({ kind: "verdict", text: fill(UI_TEXT.verdicts.segPageOut, context) });
    } else {
      lines.push({
        caption: "physical",
        value: composed ? physical : null,
        pending: true,
        fields: [
          { role: "frame", bits: frameBits, value: pageLooked ? frame : null },
          { role: "offset", bits: machine.offsetBits, value: pageLooked ? offset : null }
        ]
      });
    }
  }
  const segmentRows = machine.segments.map(function (item, index) { return [String(index), item.label, String(item.table.length)]; });
  const pageTables = machine.segments.map(function (item, index) {
    return tableBlock(["page", "frame"], ["page", "frame"], item.table.map(function (target, row) { return [String(row), String(target)]; }), {
      caption: item.label,
      active: segmentChecked && index === segment && !failure,
      highlight: pageLooked && index === segment ? [page] : []
    });
  });
  const cells = {};
  machine.segments.forEach(function (item) {
    item.table.forEach(function (target, row) { cells[target] = { label: item.label + " " + row }; });
  });
  return {
    views: {
      address: { lines: lines },
      segmentTable: { tables: [tableBlock(["segment", "content", "pages"], ["segment", null, null], segmentRows, { highlight: segmentChecked && !failure ? [segment] : [], faultRow: failure ? segment : null })] },
      pageTables: { tables: pageTables },
      memory: { kind: "frames", count: machine.frames, columns: machine.memoryColumns, cells: cells, highlight: pageLooked ? [frame] : [] }
    },
    context: context,
    outcome: failure ? failure : (composed ? physical : null)
  };
}

function invertedChains(machine) {
  const chains = {};
  machine.frames.forEach(function (entry, index) {
    if (!entry) return;
    const slot = (machine.pids[entry.pid] + entry.page) % machine.slots;
    if (!chains[slot]) chains[slot] = [];
    chains[slot].push(index);
  });
  return chains;
}

function nextInChain(chains, index) {
  let following = null;
  Object.keys(chains).forEach(function (slot) {
    const chain = chains[slot];
    const position = chain.indexOf(index);
    if (position !== -1 && position < chain.length - 1) following = chain[position + 1];
  });
  return following;
}

function invertedMachine(example, address, phase, probe) {
  const machine = example.machine;
  const rank = phaseRank("inverted", phase);
  const chains = invertedChains(machine);
  const has = address !== null && address !== undefined;
  const slot = has ? (machine.pids[address.pid] + address.page) % machine.slots : null;
  const chain = has ? (chains[slot] || []) : [];
  const found = chain.find(function (index) { return machine.frames[index].pid === address.pid && machine.frames[index].page === address.page; });
  const hashed = has && rank >= 3;
  const probing = has && rank === 4 ? probe : null;
  const probed = probing === null ? null : chain[probing];
  const composed = has && rank >= 5;
  const fault = hashed && chain.length === 0;
  const frame = found === undefined ? null : found;
  const physical = frame === null || !has ? null : frame * machine.pageSize + address.offset;
  const context = {
    proceso: has ? address.pid : null,
    numero: has ? machine.pids[address.pid] : null,
    pagina: has ? address.page : null,
    desp: has ? address.offset : null,
    ranuras: machine.slots,
    hash: slot,
    primero: chain.length > 0 ? chain[0] : null,
    sonda: probed === undefined ? null : probed,
    siguiente: probed === null || probed === undefined ? null : nextInChain(chains, probed),
    marco: (probing !== null && probed === found) || composed ? frame : null,
    tam: machine.pageSize,
    fisica: physical === null ? null : formatNumber(physical)
  };
  const lines = [];
  if (has) {
    lines.push({ caption: "logical", fields: [{ role: "pid", bits: null, value: address.pid }, { role: "page", bits: null, value: address.page }, { role: "offset", bits: null, value: address.offset }] });
    if (hashed) lines.push({ kind: "equation", status: fault ? "fail" : "ok", text: fill(UI_TEXT.equations.hash, context) });
    if (fault) lines.push({ kind: "verdict", text: fill(UI_TEXT.verdicts.pageFault, context) });
    if (composed && !fault) lines.push({ kind: "equation", status: "ok", text: fill(UI_TEXT.equations.framePhysical, context) });
  }
  const visited = [];
  if (probing !== null) for (let index = 0; index < probing; index += 1) visited.push(chain[index]);
  const rows = machine.frames.map(function (entry, index) {
    if (!entry) return [String(index), UI_TEXT.none, UI_TEXT.none, UI_TEXT.none];
    const following = nextInChain(chains, index);
    return [String(index), entry.pid, String(entry.page), following === null ? UI_TEXT.none : String(following)];
  });
  let invertedHighlight = [];
  if (probing !== null && probed !== undefined) invertedHighlight = [probed];
  if (composed && frame !== null) invertedHighlight = [frame];
  const hashRows = [];
  for (let index = 0; index < machine.slots; index += 1) {
    hashRows.push([String(index), chains[index] ? String(chains[index][0]) : UI_TEXT.none]);
  }
  return {
    views: {
      address: { lines: lines },
      inverted: { tables: [tableBlock(["frame", "process", "page", "next"], ["frame", "pid", "page", null], rows, { highlight: invertedHighlight, visited: visited })] },
      hash: { tables: [tableBlock(["slot", "first"], [null, "frame"], hashRows, { highlight: hashed && !fault ? [slot] : [], faultRow: fault ? slot : null })] }
    },
    context: context,
    outcome: fault ? "fault" : (composed ? physical : null)
  };
}

const MACHINES = {
  paging: pagingMachine,
  segments: segmentMachine,
  segPaging: segPagingMachine,
  inverted: invertedMachine
};

function derivePlaced(memory) {
  const rows = [];
  memory.blocks.forEach(function (block) {
    if (block.kind !== "seg") return;
    rows.push({ label: block.label, start: block.start, size: block.size });
  });
  return rows;
}

function placedView(memory, previousMemory) {
  const rows = derivePlaced(memory);
  const before = previousMemory ? derivePlaced(previousMemory) : [];
  const highlight = [];
  rows.forEach(function (row, index) {
    const old = before.find(function (item) { return item.label === row.label; });
    if (previousMemory && (!old || old.start !== row.start)) highlight.push(index);
  });
  return {
    tables: [tableBlock(["segmentName", "base", "size"], ["segment", null, null], rows.map(function (row) {
      return [row.label, fill(UI_TEXT.memory.kib, { n: row.start }), fill(UI_TEXT.memory.kib, { n: row.size })];
    }), { highlight: highlight })]
  };
}

function mergeViews(previous, declared) {
  const merged = Object.assign({}, previous || {});
  Object.keys(declared || {}).forEach(function (key) { merged[key] = declared[key]; });
  return merged;
}

function snapshotsOf(example, steps) {
  const snapshots = [];
  let address;
  let previous = null;
  const lists = {};
  ACCUMULATING.forEach(function (id) { lists[id] = []; });
  let clueHistory = [];
  steps.forEach(function (step, index) {
    if (step.address !== undefined) address = step.address;
    let views = mergeViews(previous ? previous.views : null, step.views);
    let context = {};
    let outcome = null;
    if (example.machine && step.phase) {
      const result = MACHINES[example.machine.type](example, address, step.phase, step.probe);
      views = mergeViews(views, result.views);
      context = result.context;
      outcome = result.outcome;
    }
    ACCUMULATING.forEach(function (id) {
      const added = step[id] || [];
      lists[id] = lists[id].concat(added);
      views[id] = { lines: lists[id].slice(), fresh: added.length };
    });
    if (example.clues) {
      if (step.clue !== undefined) clueHistory = clueHistory.concat([step.clue]);
      views.clues = { items: example.clues, used: clueHistory.slice(0, step.clue === undefined ? clueHistory.length : clueHistory.length - 1), current: step.clue === undefined ? null : step.clue };
    }
    if (views.memory && views.memory.kind === "strip" && views.memory.unit === "kib") {
      views.placed = placedView(views.memory, previous && previous.views.memory && step.views && step.views.memory ? previous.views.memory : null);
    }
    const snapshot = {
      step: step,
      index: index,
      last: index === steps.length - 1,
      views: views,
      previousViews: previous ? previous.views : {},
      context: context,
      outcome: outcome,
      narration: fill(step.narration, context),
      note: step.note ? fill(step.note, context) : null
    };
    snapshots.push(snapshot);
    previous = snapshot;
  });
  return snapshots;
}

function collectTipKeys(text, into) {
  const pattern = /\[\[(\w+):/g;
  let match = pattern.exec(text);
  while (match) {
    into[match[1]] = true;
    match = pattern.exec(text);
  }
}

function verifyText(where, text, problems) {
  if (unresolved(text)) problems.push("quedó un dato sin completar en " + where);
  if (unbalanced(text)) problems.push("quedó una marca sin cerrar en " + where);
  const keys = {};
  collectTipKeys(text, keys);
  Object.keys(keys).forEach(function (key) {
    if (!TOOLTIPS[key]) problems.push(where + " pide el globito " + key + ", que no existe");
    USED_TIPS[key] = true;
  });
}

function verifyTexts(example, snapshots, problems) {
  snapshots.forEach(function (snapshot, index) {
    verifyText("la narración del paso " + (index + 1), snapshot.narration, problems);
    if (snapshot.note) verifyText("la nota del paso " + (index + 1), snapshot.note, problems);
    Object.keys(snapshot.views).forEach(function (id) {
      const view = snapshot.views[id];
      if (view && view.lines) {
        view.lines.forEach(function (line) {
          const text = typeof line === "string" ? line : line.text;
          if (text) verifyText("una línea del panel " + id + " en el paso " + (index + 1), text, problems);
        });
      }
    });
  });
  verifyText("la frase de cierre", example.closing, problems);
  if (example.stepUnitNote) verifyText("la nota de unidad", example.stepUnitNote, problems);
  if (example.compare) {
    example.compare.rows.reduce(function (all, row) { return all.concat(row); }, example.compare.headers.slice()).forEach(function (text) {
      verifyText("la tabla comparativa", text, problems);
    });
  }
}

function verifyFieldLines(snapshots, problems) {
  snapshots.forEach(function (snapshot, index) {
    ["address", "entry"].forEach(function (id) {
      const view = snapshot.views[id];
      if (!view) return;
      view.lines.forEach(function (line) {
        if (line.kind || line.value === undefined || line.value === null) return;
        const complete = line.fields.every(function (field) { return typeof field.bits === "number" && typeof field.value === "number"; });
        if (!complete) return;
        let rebuilt = 0;
        line.fields.forEach(function (field) { rebuilt = rebuilt * power(field.bits) + field.value; });
        if (rebuilt !== line.value) problems.push("en el paso " + (index + 1) + ", los campos de la dirección no forman " + line.value);
        line.fields.forEach(function (field) {
          if (field.value >= power(field.bits)) problems.push("en el paso " + (index + 1) + ", un campo no entra en sus bits");
        });
      });
    });
  });
}

function verifyMachine(example, snapshots, problems) {
  snapshots.forEach(function (snapshot, index) {
    const step = snapshot.step;
    if (step.phase && !example.machine) problems.push("el paso " + (index + 1) + " declara una fase y el ejemplo no tiene máquina");
    if (step.phase && example.machine && PHASES[example.machine.type].indexOf(step.phase) === -1) {
      problems.push("el paso " + (index + 1) + " declara la fase " + step.phase + ", que la máquina no conoce");
    }
    if (step.expect === undefined) return;
    if (snapshot.outcome !== step.expect) {
      problems.push("el paso " + (index + 1) + " espera " + step.expect + " y la traducción da " + snapshot.outcome);
    }
  });
}

function verifyHier(example, problems) {
  const check = example.hierCheck;
  if (!check) return;
  const offsetBits = check.bits[2];
  const innerBits = check.bits[1];
  if (slice(check.address, innerBits + offsetBits, check.bits[0]) !== check.outer) problems.push("la dirección no cae en la fila " + check.outer + " de la externa");
  if (slice(check.address, offsetBits, innerBits) !== check.inner) problems.push("la dirección no cae en la fila " + check.inner + " de la interna");
  if (check.frame * power(offsetBits) + check.address % power(offsetBits) !== check.physical) problems.push("la física de la jerárquica no da " + check.physical);
}

function verifyAsks(example, steps, problems) {
  steps.forEach(function (step, index) {
    if (!step.ask) return;
    const ids = step.ask.options.map(function (option) { return option.id; });
    if (ids.indexOf(step.ask.correct) === -1) problems.push("la pregunta del paso " + (index + 1) + " no tiene entre las opciones a la correcta");
    if (new Set(ids).size !== ids.length) problems.push("la pregunta del paso " + (index + 1) + " repite una opción");
    if (step.ask.options.length < 2) problems.push("la pregunta del paso " + (index + 1) + " tiene menos de dos opciones");
    step.ask.options.forEach(function (option) {
      if (!option.why) problems.push("una opción del paso " + (index + 1) + " no explica por qué");
      verifyText("una opción del paso " + (index + 1), option.text + " " + option.why, problems);
    });
    verifyText("la pregunta del paso " + (index + 1), step.ask.question, problems);
    if (index === steps.length - 1) problems.push("el último paso tiene una pregunta, y ahí va la frase de cierre");
  });
}

function canvasPanels(canvas) {
  const flat = [];
  canvas.panels.forEach(function (entry) {
    if (Array.isArray(entry)) entry.forEach(function (id) { flat.push(id); });
    else flat.push(entry);
  });
  return flat;
}

function verifyStructure(example, steps, snapshots, problems) {
  if (!example.closing) problems.push("no tiene frase de cierre");
  if (!example.stepUnit) problems.push("no declara la unidad del paso");
  if (steps.length === 0) problems.push("no tiene pasos");
  const panels = canvasPanels(example.canvas);
  panels.forEach(function (id) {
    if (!UI_TEXT.panels[id]) problems.push("usa el panel " + id + ", que no tiene nombre");
    if (!PANEL_TIPS[id]) problems.push("usa el panel " + id + ", que no tiene globito");
  });
  snapshots.forEach(function (snapshot, index) {
    if (!snapshot.step.narration) problems.push("el paso " + (index + 1) + " no tiene narración");
    panels.forEach(function (id) {
      if (!snapshot.views[id]) problems.push("en el paso " + (index + 1) + " el panel " + id + " no tiene nada que mostrar");
    });
  });
  if (example.clues) {
    const used = steps.filter(function (step) { return step.clue !== undefined; }).map(function (step) { return step.clue; });
    if (new Set(used).size !== example.clues.length) problems.push("no se usan todas las pistas, o alguna se usa dos veces");
  }
}

function buildVariant(example, label) {
  const problems = [];
  const snapshots = snapshotsOf(example, example.steps);
  verifyStructure(example, example.steps, snapshots, problems);
  verifyTexts(example, snapshots, problems);
  verifyFieldLines(snapshots, problems);
  verifyMachine(example, snapshots, problems);
  verifyAsks(example, example.steps, problems);
  verifyHier(example, problems);
  return {
    label: label,
    example: example,
    snapshots: snapshots,
    problems: problems.map(function (problem) { return label ? label + ": " + problem : problem; })
  };
}

function buildExample(example) {
  if (!example.variants) {
    const built = buildVariant(example, null);
    return { example: example, variants: [built], problems: built.problems };
  }
  const built = example.variants.map(function (variant) {
    const merged = Object.assign({}, example, variant);
    delete merged.variants;
    return buildVariant(merged, variant.variantLabel);
  });
  const problems = [];
  built.forEach(function (one) { one.problems.forEach(function (problem) { problems.push(problem); }); });
  if (example.variants.length < 2) problems.push("declara variantes y tiene menos de dos");
  const labels = example.variants.map(function (variant) { return variant.variantLabel; });
  if (labels.some(function (text) { return !text; })) problems.push("hay una variante sin nombre");
  if (new Set(labels).size !== labels.length) problems.push("hay dos variantes con el mismo nombre");
  return { example: example, variants: built, problems: problems };
}

const BUILT_EXAMPLES = EXAMPLES.map(buildExample);

(function verifyGroupsAreContiguous() {

BUILT_EXAMPLES.forEach(function (built) {

Object.keys(TOOLTIPS).forEach(function (key) {

});

function askBlock(ask) {
  const box = element("div", "ask-box");
  box.appendChild(element("span", "tag", UI_TEXT.ask.tag));
  renderRich(box.appendChild(element("p", "question")), ask.question);
  const chosen = currentAnswer();
  if (!chosen) {
    const options = element("div", "ask-options");
    ask.options.forEach(function (option) {
      const button = element("button", null, option.text);
      button.type = "button";
      button.addEventListener("click", function () { answerWith(option.id); });
      options.appendChild(button);
    });
    box.appendChild(options);
    return box;
  }
  const picked = ask.options.find(function (option) { return option.id === chosen; });
  const right = ask.options.find(function (option) { return option.id === ask.correct; });
  const result = element("div", "ask-result");
  const mine = element("p", "answer " + (chosen === ask.correct ? "right" : "wrong"));
  mine.appendChild(element("span", "head", (chosen === ask.correct ? UI_TEXT.ask.right : UI_TEXT.ask.wrong) + " " + picked.text));
  renderRich(mine.appendChild(element("span")), picked.why);
  result.appendChild(mine);
  if (chosen !== ask.correct) {
    const good = element("p", "answer right");
    good.appendChild(element("span", "head", fill(UI_TEXT.ask.correctIs, { text: right.text })));
    renderRich(good.appendChild(element("span")), right.why);
    result.appendChild(good);
  }
  const retry = element("button", "retry", UI_TEXT.ask.retry);
  retry.type = "button";
  retry.addEventListener("click", clearAnswer);
  result.appendChild(retry);
  box.appendChild(result);
  return box;
}

function renderNarration(snapshot) {
  const example = currentExample();
  const ask = snapshot.step.ask;
  dom.narration.textContent = "";
  dom.narration.classList.toggle("with-extras", snapshot.last === true || Boolean(ask));
  dom.narration.classList.toggle("no-compare", snapshot.last === true && !example.compare);
  dom.narration.classList.toggle("asking", Boolean(ask) && !snapshot.last);
  const main = element("div", "narration-main");
  renderRich(main.appendChild(element("p", "narration-text")), snapshot.narration);
  if (snapshot.note) renderRich(main.appendChild(element("p", "narration-note")), snapshot.note);
  if (view.stepIndex === 0 && example.stepUnitNote) renderRich(main.appendChild(element("p", "narration-note")), example.stepUnitNote);
  dom.narration.appendChild(main);
  if (ask) {
    const extras = element("div", "narration-extras");
    extras.appendChild(askBlock(ask));
    dom.narration.appendChild(extras);
    return;
  }
  if (!snapshot.last) return;
  if (example.compare) {
    const table = compareBlock(example.compare);
    table.classList.add("full");
    dom.narration.appendChild(table);
  }
  const extras = element("div", "narration-extras");
  extras.appendChild(takeawayBlock(example.closing));
  dom.narration.appendChild(extras);
}

function render() {
  const example = currentExample();
  const snapshot = currentSnapshot();
  const total = totalSteps();
  buildCanvas();
  dom.title.textContent = example.number + ". " + example.title;
  dom.subtitle.textContent = example.subtitle;
  dom.stepUnit.textContent = example.stepUnit;
  renderHeaderChoices();
  Object.keys(panelRefs).forEach(function (id) { PANELS[id](snapshot, id); });
  renderNarration(snapshot);
  dom.progress.textContent = fill(UI_TEXT.progress, { current: view.stepIndex + 1, total: total });
  dom.progressFill.style.transform = "scaleX(" + ((view.stepIndex + 1) / total) + ")";
  dom.first.disabled = view.stepIndex === 0;
  dom.prev.disabled = view.stepIndex === 0;
  dom.next.disabled = view.stepIndex === total - 1;
  dom.last.disabled = view.stepIndex === total - 1;
  dom.play.textContent = view.playing ? UI_TEXT.pause : UI_TEXT.play;
  Array.prototype.forEach.call(dom.exampleList.querySelectorAll("button"), function (button, position) {
    button.setAttribute("aria-current", position === view.exampleIndex ? "true" : "false");
  });
}

function goTo(index) {
  const total = totalSteps();
  view.stepIndex = Math.max(0, Math.min(index, total - 1));
  render();
  if (view.playing && view.stepIndex === total - 1) stopPlaying();
}

function answerWith(id) {
  view.answers[answerKey()] = id;
  writeStore();
  render();
  const retry = dom.narration.querySelector(".retry");
  if (retry) retry.focus();
}

function clearAnswer() {
  delete view.answers[answerKey()];
  writeStore();
  render();
  const first = dom.narration.querySelector(".ask-options button");
  if (first) first.focus();
}

function selectExample(index) {
  stopPlaying();
  view.exampleIndex = index;
  view.variantIndex = 0;
  view.stepIndex = 0;
  render();
}

function selectVariant(index) {
  stopPlaying();
  view.variantIndex = index;
  view.stepIndex = 0;
  render();
}

function stopPlaying() {
  view.playing = false;
  if (view.timer) { clearTimeout(view.timer); view.timer = null; }
  dom.play.textContent = UI_TEXT.play;
}

function scheduleTick() {
  if (view.timer) clearTimeout(view.timer);
  view.timer = setTimeout(function () {
    if (!view.playing) return;
    if (view.stepIndex >= totalSteps() - 1) { stopPlaying(); render(); return; }
    goTo(view.stepIndex + 1);
    if (view.playing) scheduleTick();
  }, AUTOPLAY_DELAY);
}

function startPlaying() {
  view.playing = true;
  scheduleTick();
  render();
}

function togglePlaying() {
  if (view.playing) { stopPlaying(); render(); return; }
  startPlaying();
}

function lookupTooltip(key) {
  if (key.indexOf("panel:") === 0) return PANEL_TIPS[key.slice(6)];
  return TOOLTIPS[key];
}

function showTooltip(trigger, tip) {
  dom.tooltip.textContent = "";
  dom.tooltip.appendChild(element("strong", "tip-title", tip.title));
  dom.tooltip.appendChild(document.createTextNode(tip.body));
  dom.tooltip.classList.add("open");
  const box = trigger.getBoundingClientRect();
  const width = dom.tooltip.offsetWidth;
  const height = dom.tooltip.offsetHeight;
  let left = box.left + box.width / 2 - width / 2;
  left = Math.min(left, window.innerWidth - width - 8);
  let top = box.top - height - 8;
  if (top < 8) top = box.bottom + 8;
  dom.tooltip.style.left = Math.max(8, left) + "px";
  dom.tooltip.style.top = top + "px";
}

function hideTooltip() { dom.tooltip.classList.remove("open"); }

function closestElement(target, selector) {
  return target && typeof target.closest === "function" ? target.closest(selector) : null;
}

["mouseover", "focusin"].forEach(function (name) {
  document.addEventListener(name, function (event) {
    const trigger = closestElement(event.target, "[data-tip]");
    const tip = trigger ? lookupTooltip(trigger.dataset.tip) : null;
    if (tip) showTooltip(trigger, tip);
    else hideTooltip();
  });
});

["mouseout", "focusout", "scroll"].forEach(function (name) {
  document.addEventListener(name, hideTooltip, true);
});

dom.first.addEventListener("click", function () { stopPlaying(); goTo(0); });
dom.prev.addEventListener("click", function () { stopPlaying(); goTo(view.stepIndex - 1); });
dom.next.addEventListener("click", function () { stopPlaying(); goTo(view.stepIndex + 1); });
dom.last.addEventListener("click", function () { stopPlaying(); goTo(totalSteps() - 1); });
dom.play.addEventListener("click", togglePlaying);

document.addEventListener("keydown", function (event) {
  if (event.target && event.target.tagName === "BUTTON" && (event.key === " " || event.key === "Enter")) return;
  if (event.key === "ArrowRight") { stopPlaying(); goTo(view.stepIndex + 1); event.preventDefault(); }
  if (event.key === "ArrowLeft") { stopPlaying(); goTo(view.stepIndex - 1); event.preventDefault(); }
  if (event.key === "Home") { stopPlaying(); goTo(0); event.preventDefault(); }
  if (event.key === "End") { stopPlaying(); goTo(totalSteps() - 1); event.preventDefault(); }
  if (event.key === "Escape") hideTooltip();
});

dom.pageTitle.textContent = UI_TEXT.pageTitle;
dom.first.textContent = UI_TEXT.firstStep;
dom.prev.textContent = UI_TEXT.prevStep;
dom.next.textContent = UI_TEXT.nextStep;
dom.last.textContent = UI_TEXT.lastStep;
dom.play.textContent = UI_TEXT.play;

Object.keys(UI_TEXT.panels).forEach(function (id) {
  if (!PANELS[id]) console.error("El panel " + id + " tiene nombre pero no tiene dibujo");
});

Object.keys(PANELS).forEach(function (id) {
  if (!UI_TEXT.panels[id]) console.error("El panel " + id + " tiene dibujo pero no tiene nombre");
});

renderExampleList();
render();
</script>
</body>
</html>
