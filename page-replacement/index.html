<script id="ui">
const dom = {
  pageTitle: document.getElementById("pageTitle"),
  exampleList: document.getElementById("exampleList"),
  modeLabel: document.getElementById("modeLabel"),
  modeBar: document.getElementById("modeBar"),
  choiceRow: document.getElementById("choiceRow"),
  choiceLabel: document.getElementById("choiceLabel"),
  choiceBar: document.getElementById("choiceBar"),
  narration: document.getElementById("narrationPanel"),
  main: document.getElementById("main"),
  title: document.getElementById("exampleTitle"),
  subtitle: document.getElementById("exampleSubtitle"),
  stepUnit: document.getElementById("stepUnit"),
  progress: document.getElementById("progress"),
  progressFill: document.getElementById("progressFill"),
  first: document.getElementById("firstStep"),
  prev: document.getElementById("prevStep"),
  next: document.getElementById("nextStep"),
  last: document.getElementById("lastStep"),
  play: document.getElementById("playPause"),
  restart: document.getElementById("restartExample"),
  score: document.getElementById("score"),
  tooltip: document.getElementById("tooltip")
};

const AUTOPLAY_DELAY = 2800;
const STORE_KEY = "ssoo-recursos:page-replacement:v1";
const TLB_OPTIONS = ["tlb", "table", "fault"];

const PANELS = {
  board: renderBoard,
  tlbBoard: renderBoard,
  state: renderState
};

const panelRefs = {};
let canvasKey = "";

const view = { exampleIndex: 0, variantIndex: 0, position: 0, mode: "solve", hints: true, playing: false, timer: null };

function readStore() {
  try {
    const raw = window.localStorage.getItem(STORE_KEY);
    const parsed = raw ? JSON.parse(raw) : null;
    return parsed && typeof parsed === "object" ? parsed : {};
  } catch (error) {
    return {};
  }
}

function writeStore() {
  try {
    window.localStorage.setItem(STORE_KEY, JSON.stringify(progress));
  } catch (error) {
    return;
  }
}

const progress = readStore();

function currentEntry() { return BUILT_EXAMPLES[view.exampleIndex]; }
function currentBuilt() { return currentEntry().variants[view.variantIndex]; }
function currentExample() { return currentBuilt().example; }

function progressKey(exampleIndex, variantIndex) {
  return BUILT_EXAMPLES[exampleIndex].example.number + ":" + variantIndex;
}

function validAnswers(built, saved) {
  if (!saved || !Array.isArray(saved.answers) || saved.answers.length > built.executed) return false;
  const allowed = built.example.algorithm === "tlb"
    ? TLB_OPTIONS
    : built.example.frames.map(function (label, index) { return String(index); }).concat(built.example.invalidOption ? ["invalid"] : []);
  return saved.answers.every(function (answer) { return answer && allowed.indexOf(answer.given) !== -1; });
}

function storedAnswers(exampleIndex, variantIndex) {
  const built = BUILT_EXAMPLES[exampleIndex].variants[variantIndex];
  const saved = progress[progressKey(exampleIndex, variantIndex)];
  return validAnswers(built, saved) ? saved.answers : [];
}

function answers() { return storedAnswers(view.exampleIndex, view.variantIndex); }
function answeredCount() { return answers().length; }

function liveReference() {
  if (view.mode !== "solve") return null;
  const count = answeredCount();
  if (view.position !== count || count >= currentBuilt().executed) return null;
  return count + 1;
}

function maxIndex() {
  return view.mode === "watch" ? currentBuilt().executed : answeredCount();
}

function totalSteps() { return currentBuilt().executed + 1; }

function exampleSolved(exampleIndex) {
  return BUILT_EXAMPLES[exampleIndex].variants.every(function (built, variantIndex) {
    return storedAnswers(exampleIndex, variantIndex).length === built.executed;
  });
}

function element(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined && text !== null) node.textContent = text;
  return node;
}

function renderRich(target, text) {
  target.textContent = "";
  const pattern = /\[\[(\w+):([^\]]+)\]\]|\*([^*]+)\*/g;
  let cursor = 0;
  let match = pattern.exec(text);
  while (match) {
    if (match.index > cursor) target.appendChild(document.createTextNode(text.slice(cursor, match.index)));
    if (match[1]) {
      const button = element("button", "tip", match[2]);
      button.type = "button";
      button.dataset.tip = match[1];
      target.appendChild(button);
    } else {
      target.appendChild(element("strong", null, match[3]));
    }
    cursor = match.index + match[0].length;
    match = pattern.exec(text);
  }
  if (cursor < text.length) target.appendChild(document.createTextNode(text.slice(cursor)));
  return target;
}

function buildPanel(id) {
  const refs = { body: element("div", "panel-body") };
  const section = element("section", "panel " + id);
  const heading = element("h2");
  const title = element("button", "tip", UI_TEXT.panels[id]);
  title.type = "button";
  title.dataset.tip = "panel:" + id;
  heading.appendChild(title);
  refs.note = heading.appendChild(element("span", "panel-note"));
  refs.tools = heading.appendChild(element("span", "tool-row"));
  section.appendChild(heading);
  section.appendChild(refs.body);
  refs.section = section;
  return refs;
}

function buildCanvas() {
  const example = currentExample();
  const canvas = example.canvas;
  const key = example.number + "|" + view.variantIndex + "|" + canvas.columns + "|" + canvas.panels.join(",");
  if (key === canvasKey) return;
  canvasKey = key;
  Object.keys(panelRefs).forEach(function (id) { delete panelRefs[id]; });
  const fresh = element("main");
  fresh.id = "main";
  fresh.style.gridTemplateColumns = canvas.columns;
  canvas.panels.forEach(function (id) {
    const refs = buildPanel(id);
    panelRefs[id] = refs;
    fresh.appendChild(refs.section);
  });
  dom.main.replaceWith(fresh);
  dom.main = fresh;
}

function renderExampleList() {
  dom.exampleList.textContent = "";
  let lastGroup = null;
  let section = null;
  BUILT_EXAMPLES.forEach(function (built, index) {
    if (built.example.group !== lastGroup) {
      section = element("span", "group");
      section.appendChild(element("span", "group-cap", UI_TEXT.groups[built.example.group]));
      dom.exampleList.appendChild(section);
      lastGroup = built.example.group;
    }
    const button = element("button");
    button.type = "button";
    button.dataset.focus = "example:" + index;
    button.appendChild(element("span", "num", built.example.number));
    button.appendChild(element("span", "tick", UI_TEXT.solvedMark));
    button.addEventListener("click", function () { selectExample(index); });
    section.appendChild(button);
  });
}

function updateExampleList() {
  Array.prototype.forEach.call(dom.exampleList.querySelectorAll("button"), function (button, index) {
    const example = BUILT_EXAMPLES[index].example;
    const solved = exampleSolved(index);
    button.setAttribute("aria-current", index === view.exampleIndex ? "true" : "false");
    button.classList.toggle("solved", solved);
    button.title = example.short + " · " + example.adds + (solved ? " · " + UI_TEXT.solvedTip : "");
  });
}

function renderSwitch(container, entries, activeKey, onPick, focusPrefix) {
  container.textContent = "";
  entries.forEach(function (entry) {
    const button = element("button", null, entry.label);
    button.type = "button";
    button.dataset.focus = focusPrefix + ":" + entry.key;
    button.setAttribute("aria-pressed", entry.key === activeKey ? "true" : "false");
    button.addEventListener("click", function () { onPick(entry.key); });
    container.appendChild(button);
  });
}

function renderModes() {
  dom.modeLabel.textContent = UI_TEXT.modeLabel;
  renderSwitch(dom.modeBar, [
    { key: "solve", label: UI_TEXT.modes.solve },
    { key: "watch", label: UI_TEXT.modes.watch }
  ], view.mode, selectMode, "mode");
}

function renderHeaderChoices() {
  const entry = currentEntry();
  if (entry.variants.length < 2) { dom.choiceBar.textContent = ""; dom.choiceRow.hidden = true; return; }
  dom.choiceRow.hidden = false;
  dom.choiceLabel.textContent = entry.example.variantLabel;
  renderSwitch(dom.choiceBar, entry.variants.map(function (built, index) {
    return { key: String(index), label: built.label };
  }), String(view.variantIndex), function (key) { selectVariant(Number(key)); }, "variant");
}

function bitsText(example, frame) {
  const bits = example.bits || [];
  if (bits.indexOf("u") !== -1 && bits.indexOf("m") !== -1) return fill(UI_TEXT.board.bitUM, { u: frame.u, m: frame.m });
  if (bits.indexOf("u") !== -1) return fill(UI_TEXT.board.bitU, { u: frame.u });
  if (bits.indexOf("m") !== -1) return fill(UI_TEXT.board.bitM, { m: frame.m });
  return null;
}

function frameCellContent(cell, example, state, index) {
  const frame = state.frames[index];
  if (frame.page === null) {
    cell.classList.add("empty");
    if (isClock(example) && state.pointer === index) cell.appendChild(element("span", "ptr", UI_TEXT.board.pointer));
    return;
  }
  if (isClock(example) && state.pointer === index) cell.appendChild(element("span", "ptr", UI_TEXT.board.pointer));
  cell.appendChild(document.createTextNode(String(frame.page)));
  const bits = bitsText(example, frame);
  if (bits) cell.appendChild(element("span", "bits", bits));
}

function columnStatus(k) {
  const built = currentBuilt();
  if (k > built.executed) return "skipped";
  if (k <= view.position) return "revealed";
  if (k === liveReference()) return "live";
  return "future";
}

function headerRow(label, className) {
  const row = element("tr", className);
  row.appendChild(element("th", "row-label", label));
  return row;
}

function boardHead(table, example, built, hasInitial) {
  const head = element("thead");
  const indexRow = headerRow(UI_TEXT.board.indexRow);
  const addressRow = headerRow(UI_TEXT.board.addressRow);
  const pageRow = headerRow(UI_TEXT.board.pageRow);
  indexRow.firstChild.setAttribute("scope", "row");
  if (hasInitial) {
    indexRow.appendChild(element("th", "initial-head", UI_TEXT.board.initialColumn));
    addressRow.appendChild(element("th"));
    pageRow.appendChild(element("th"));
  }
  built.references.forEach(function (reference, position) {
    const k = position + 1;
    const status = columnStatus(k);
    const extra = (k === view.position ? " current" : "") + (status === "skipped" ? " skipped" : "") + (status === "live" ? " live" : "");
    const index = element("th", "col-index col-head" + extra, String(k));
    index.setAttribute("scope", "col");
    if (status === "skipped") index.title = UI_TEXT.board.skippedTitle;
    indexRow.appendChild(index);
    if (reference.address !== undefined) {
      addressRow.appendChild(element("th", "col-address col-head" + extra, fill(UI_TEXT.board.address, { address: reference.address, mode: UI_TEXT.board.modeShort[reference.mode] })));
    }
    pageRow.appendChild(element("th", "col-page col-head" + extra, String(reference.page)));
  });
  head.appendChild(indexRow);
  if (built.references[0].address !== undefined) head.appendChild(addressRow);
  head.appendChild(pageRow);
  table.appendChild(head);
}

function pickButton(example, built, k, index) {
  const state = built.states[k - 1];
  const frame = state.frames[index];
  const reference = built.references[k - 1];
  const button = element("button", "pick");
  button.type = "button";
  button.dataset.focus = "pick:" + index;
  button.setAttribute("aria-label", fill(UI_TEXT.board.pickLabel, { frame: example.frames[index], page: reference.page }));
  const then = element("span", "then");
  if (frame.page !== null) then.textContent = (isClock(example) && state.pointer === index ? UI_TEXT.board.pointer + " " : "") + frame.page;
  else if (isClock(example) && state.pointer === index) then.textContent = UI_TEXT.board.pointer;
  button.appendChild(then);
  button.appendChild(element("span", "ghost", String(reference.page)));
  const bits = frame.page !== null ? bitsText(example, frame) : null;
  if (bits) button.appendChild(element("span", "bits", bits));
  button.addEventListener("click", function () { answer(String(index)); });
  return button;
}

function frameRows(body, example, built, hasInitial) {
  example.frames.forEach(function (label, index) {
    const row = headerRow(fill(UI_TEXT.board.frameRow, { frame: label }));
    row.firstChild.classList.add("frame");
    row.firstChild.setAttribute("scope", "row");
    if (hasInitial) {
      const cell = element("td", "cell initial");
      frameCellContent(cell, example, built.states[0], index);
      row.appendChild(cell);
    }
    built.references.forEach(function (reference, position) {
      const k = position + 1;
      const status = columnStatus(k);
      const cell = element("td", "cell");
      if (status === "revealed") {
        frameCellContent(cell, example, built.states[k], index);
        const record = built.records[k - 1];
        if (k === view.position && record.frame === index) cell.classList.add("fresh");
      } else if (status === "live" && example.algorithm !== "tlb") {
        cell.classList.add("live");
        cell.appendChild(pickButton(example, built, k, index));
      } else if (status === "skipped") {
        cell.classList.add("skipped");
        cell.textContent = UI_TEXT.board.skippedMark;
      } else {
        cell.classList.add("future");
      }
      row.appendChild(cell);
    });
    body.appendChild(row);
  });
}

function tlbRows(body, example, built) {
  for (let slot = 0; slot < example.tlbSize; slot += 1) {
    const row = headerRow(fill(UI_TEXT.board.tlbRow, { slot: slot + 1 }), slot === 0 ? "split" : null);
    row.firstChild.classList.add("frame");
    row.firstChild.setAttribute("scope", "row");
    built.references.forEach(function (reference, position) {
      const k = position + 1;
      const status = columnStatus(k);
      const cell = element("td", "cell");
      if (status === "revealed") {
        const entry = built.states[k].tlb[slot];
        if (entry === null) cell.classList.add("empty");
        else cell.textContent = String(entry.page);
        if (k === view.position && built.records[k - 1].slot === slot) cell.classList.add("fresh");
      } else {
        cell.classList.add("future");
      }
      row.appendChild(cell);
    });
    body.appendChild(row);
  }
}

function markRow(body, label, built, hasInitial, valueFor, className) {
  const row = headerRow(label, className);
  row.firstChild.setAttribute("scope", "row");
  if (hasInitial) row.appendChild(element("td"));
  built.references.forEach(function (reference, position) {
    const k = position + 1;
    const cell = element("td", "mark-cell");
    if (columnStatus(k) === "revealed") {
      const value = valueFor(built.records[k - 1], k);
      if (value) {
        cell.textContent = value.text;
        if (value.className) value.className.split(" ").forEach(function (name) { cell.classList.add(name); });
      }
    }
    row.appendChild(cell);
  });
  body.appendChild(row);
}

function markRows(body, example, built, hasInitial) {
  const board = UI_TEXT.board;
  if (example.algorithm === "tlb") {
    markRow(body, board.resultRow, built, false, function (record) {
      return { text: board.results[record.kind], className: record.kind === "fault" ? "fault" : null };
    }, "split");
  } else {
    markRow(body, board.faultRow, built, hasInitial, function (record) {
      if (record.kind === "invalid") return { text: board.invalidMark, className: "fault small" };
      return FAULT_KINDS[record.kind] ? { text: board.faultMark, className: "fault" } : null;
    }, "split");
    markRow(body, board.victimRow, built, hasInitial, function (record) {
      return record.victim !== undefined ? { text: String(record.victim) } : null;
    });
    if (example.bits && example.bits.indexOf("m") !== -1) {
      markRow(body, board.diskRow, built, hasInitial, function (record) {
        return record.written ? { text: String(record.victim) } : null;
      });
    }
  }
  if (view.mode === "solve") {
    const given = answers();
    markRow(body, board.youRow, built, hasInitial && example.algorithm !== "tlb", function (record, k) {
      const mine = given[k - 1];
      if (!mine) return null;
      return mine.given === built.answers[k - 1] ? { text: board.right, className: "right" } : { text: board.wrong, className: "wrong" };
    });
  }
}

function legendItems(example) {
  const legend = UI_TEXT.board.legend;
  if (example.algorithm === "tlb") {
    return [
      Object.assign({}, legend.tlb, { text: fill(legend.tlb.text, example.costs.tlb) }),
      Object.assign({}, legend.table, { text: fill(legend.table.text, example.costs.table) }),
      Object.assign({ fault: true }, legend.tlbFault, { text: fill(legend.tlbFault.text, example.costs.fault) }),
      Object.assign({ ring: true }, legend.current)
    ];
  }
  const items = [Object.assign({ fault: true }, legend.fault), legend.victim];
  const bits = example.bits || [];
  if (isClock(example)) items.push(legend.pointer);
  if (bits.indexOf("u") !== -1) items.push(legend.u);
  if (bits.indexOf("m") !== -1) items.push(legend.m, legend.disk);
  if (example.references[0] && example.references[0].mode) items.push(legend.modes);
  items.push(Object.assign({ ring: true }, legend.current));
  return items;
}

function renderLegend(container, example) {
  const legend = element("div", "legend");
  legendItems(example).forEach(function (item) {
    const node = element("span", "item");
    if (item.ring) node.appendChild(element("span", "ring"));
    else node.appendChild(element("span", "token" + (item.fault ? " fault" : ""), item.token));
    node.appendChild(document.createTextNode(item.text));
    legend.appendChild(node);
  });
  container.appendChild(legend);
}

function renderBoardTools(refs, example) {
  refs.tools.textContent = "";
  const live = liveReference();
  const wantsTools = live && (example.algorithm === "tlb" || example.invalidOption);
  refs.tools.hidden = !wantsTools;
  if (!wantsTools) return;
  refs.tools.appendChild(element("span", "toggle-label", UI_TEXT.answerLabel));
  const options = example.algorithm === "tlb" ? TLB_OPTIONS : ["invalid"];
  options.forEach(function (key, position) {
    const button = element("button", "answer");
    button.type = "button";
    button.dataset.focus = "answer:" + key;
    if (example.algorithm === "tlb") button.appendChild(element("span", "key", String(position + 1)));
    button.appendChild(document.createTextNode(UI_TEXT.answers[key]));
    button.addEventListener("click", function () { answer(key); });
    refs.tools.appendChild(button);
  });
}

function renderBoard() {
  const example = currentExample();
  const built = currentBuilt();
  const id = example.canvas.panels[0];
  const refs = panelRefs[id];
  refs.note.textContent = "";
  renderBoardTools(refs, example);
  refs.body.textContent = "";
  refs.body.classList.add("board-body");
  const hasInitial = Boolean(example.initial);
  const scroll = element("div", "board-scroll");
  const table = element("table", "grid" + (example.algorithm === "tlb" ? " compact" : ""));
  boardHead(table, example, built, hasInitial);
  const body = element("tbody");
  frameRows(body, example, built, hasInitial);
  if (example.algorithm === "tlb") tlbRows(body, example, built);
  markRows(body, example, built, hasInitial);
  table.appendChild(body);
  scroll.appendChild(table);
  refs.body.appendChild(scroll);
  renderLegend(refs.body, example);
}

function hintsShown(example) {
  return view.mode === "watch" || view.hints || !example.hints;
}

function counterBlock(caption, value, fresh) {
  const box = element("span", "counter" + (fresh ? " fresh" : ""));
  box.appendChild(element("span", "caption", caption));
  box.appendChild(element("span", "value", String(value)));
  return box;
}

function renderCounters(container, example, state, before) {
  const row = element("div", "counters");
  const labels = UI_TEXT.state;
  const changed = function (key) { return before !== null && state.counters[key] !== before.counters[key]; };
  row.appendChild(counterBlock(labels.faults, state.counters.faults, changed("faults")));
  if (example.bits && example.bits.indexOf("m") !== -1) row.appendChild(counterBlock(labels.writes, state.counters.writes, changed("writes")));
  if (example.algorithm === "tlb") {
    const box = element("span", "counter");
    box.appendChild(element("span", "caption", labels.accessesTitle));
    ["tlb", "memory", "disk"].forEach(function (key) {
      const pair = element("span", "pair" + (changed(key) ? " fresh" : ""));
      pair.appendChild(element("span", "caption", labels.accesses[key]));
      pair.appendChild(element("span", "value", String(state.counters[key])));
      box.appendChild(pair);
    });
    row.appendChild(box);
  }
  container.appendChild(row);
}

function frameInfo(example, built, state, frame) {
  const labels = UI_TEXT.state;
  const parts = [];
  if (frame.page === null) return parts;
  const bits = example.bits || [];
  if (example.algorithm === "fifo") parts.push(fill(labels.since, { n: frame.since }));
  if (example.algorithm === "optimal") {
    const at = nextUseOf(built.references, frame.page, view.position);
    parts.push(at === null ? labels.nextNever : fill(labels.nextAt, { n: at }));
  }
  if (example.algorithm === "lru" || example.algorithm === "tlb") parts.push(frame.lastText);
  if (bits.indexOf("u") !== -1) parts.push(fill(labels.bitU, { u: frame.u }));
  if (bits.indexOf("m") !== -1) parts.push(fill(labels.bitM, { m: frame.m }));
  return parts;
}

function renderFrameList(container, example, built, state, before) {
  const labels = UI_TEXT.state;
  const shown = hintsShown(example);
  container.appendChild(element("div", "sub-title", labels.framesTitle));
  const list = element("div", "frame-list");
  state.frames.forEach(function (frame, index) {
    const row = element("div", "frame-row");
    row.appendChild(element("span", "who", fill(UI_TEXT.board.frameRow, { frame: frame.label })));
    const page = element("span", "page" + (frame.page === null ? " free" : ""), frame.page === null ? labels.free : String(frame.page));
    if (before && before.frames[index].page !== frame.page) page.classList.add("fresh");
    row.appendChild(page);
    const info = element("span", "info");
    const persistent = example.bits && !example.hints;
    if (shown || persistent) frameInfo(example, built, state, frame).forEach(function (text) { info.appendChild(element("span", null, text)); });
    if (isClock(example) && state.pointer === index) info.appendChild(element("span", "ptr-tag", labels.pointerTag));
    row.appendChild(info);
    list.appendChild(row);
  });
  container.appendChild(list);
}

function orderBlock(title, items, freshPage) {
  const labels = UI_TEXT.state;
  const block = element("div");
  block.appendChild(element("div", "sub-title", title));
  const line = element("div", "order");
  if (items.length === 0) line.appendChild(element("span", "empty", labels.emptyOrder));
  items.forEach(function (item, index) {
    if (index > 0) line.appendChild(element("span", "arrow", labels.orderArrow));
    const chip = element("span", "chip" + (item.page === freshPage ? " fresh" : ""));
    chip.title = item.title;
    chip.appendChild(element("span", "value", String(item.page)));
    chip.appendChild(element("span", "caption", item.caption));
    line.appendChild(chip);
  });
  block.appendChild(line);
  return block;
}

function renderOrders(container, built, state) {
  const labels = UI_TEXT.state;
  if (!hintsShown(built.example)) return;
  const record = view.position > 0 ? built.records[view.position - 1] : null;
  const usedPage = record ? record.page : null;
  const insertedPage = record && record.kind !== "tlb" ? record.page : null;
  const frames = state.frames.filter(function (frame) { return frame.page !== null; })
    .sort(function (one, two) { return one.order - two.order; })
    .map(function (frame) { return { page: frame.page, caption: fill(labels.lruChip, { n: frame.order - REFERENCE_ORDER_BASE }), title: frame.lastText }; });
  const entries = state.tlb.filter(function (entry) { return entry !== null; })
    .sort(function (one, two) { return one.since - two.since; })
    .map(function (entry) { return { page: entry.page, caption: fill(labels.fifoChip, { n: entry.since }), title: fill(labels.since, { n: entry.since }) }; });
  container.appendChild(orderBlock(labels.lruOrderTitle, frames, usedPage));
  container.appendChild(orderBlock(labels.fifoOrderTitle, entries, insertedPage));
}

function renderHintsToggle(refs, example) {
  refs.tools.textContent = "";
  const optional = view.mode === "solve" && example.hints;
  refs.tools.hidden = !optional;
  if (!optional) return;
  refs.tools.appendChild(element("span", "toggle-label", UI_TEXT.hintsLabel));
  const bar = element("span", "switch");
  bar.setAttribute("role", "group");
  bar.setAttribute("aria-label", UI_TEXT.hintsLabel);
  renderSwitch(bar, [
    { key: "show", label: UI_TEXT.hints.show },
    { key: "hide", label: UI_TEXT.hints.hide }
  ], view.hints ? "show" : "hide", function (key) {
    view.hints = key === "show";
    render();
  }, "hints");
  refs.tools.appendChild(bar);
}

function renderState() {
  const example = currentExample();
  const built = currentBuilt();
  const refs = panelRefs.state;
  const state = built.states[view.position];
  const before = view.position > 0 ? built.states[view.position - 1] : null;
  refs.note.textContent = "";
  renderHintsToggle(refs, example);
  refs.body.textContent = "";
  refs.body.classList.add("state-body");
  const when = refs.body.appendChild(element("p", "when"));
  when.appendChild(element("span", null, view.position === 0 ? UI_TEXT.state.initialNote : fill(UI_TEXT.state.afterNote, { n: view.position })));
  if (state.terminated) when.appendChild(element("span", "ended", UI_TEXT.state.ended));
  renderCounters(refs.body, example, state, before);
  if (example.algorithm === "tlb") renderOrders(refs.body, built, state);
  else {
    const frames = element("div");
    renderFrameList(frames, example, built, state, before);
    refs.body.appendChild(frames);
  }
  if (!hintsShown(example)) refs.body.appendChild(element("p", "hidden-note", UI_TEXT.state.hiddenNote));
}

function takeawayBlock(text) {
  const box = element("div", "takeaway");
  box.appendChild(element("span", "tag", UI_TEXT.takeawayTag));
  renderRich(box.appendChild(element("span", "line")), text);
  return box;
}

function compareBlock(compare) {
  const wrapper = element("div", "compare full");
  const table = element("table");
  const head = element("tr");
  compare.headers.forEach(function (text) { renderRich(head.appendChild(element("th")), fill(text, TOTALS)); });
  table.appendChild(head);
  compare.rows.forEach(function (cells) {
    const row = element("tr");
    cells.forEach(function (text, column) {
      renderRich(row.appendChild(element("td", column === 0 ? "label" : null)), fill(text, TOTALS));
    });
    table.appendChild(row);
  });
  wrapper.appendChild(table);
  return wrapper;
}

function verdictFor(record, given, example) {
  const feedback = UI_TEXT.feedback;
  const correct = correctAnswer(record, example);
  if (given === correct) return { right: true, text: feedback.right };
  if (example.algorithm === "tlb") return { right: false, text: fill(feedback.wrongTlb, { given: UI_TEXT.answers[given], correct: UI_TEXT.answers[correct] }) };
  if (given === "invalid") return { right: false, text: feedback.wrongInvalid };
  if (correct === "invalid") return { right: false, text: feedback.wrongFrameOnInvalid };
  return { right: false, text: fill(feedback.wrongFrame, { given: example.frames[Number(given)] }) };
}

function promptFor(example, built, n) {
  const feedback = UI_TEXT.feedback;
  const reference = built.references[n - 1];
  if (example.algorithm === "tlb") return fill(feedback.promptTlb, { n: n, page: reference.page });
  if (reference.address !== undefined) {
    return fill(feedback.promptAddress, { n: n, address: reference.address, modeName: UI_TEXT.narr.modeName[reference.mode], invalid: UI_TEXT.answers.invalid, count: example.frames.length });
  }
  return fill(feedback.prompt, { n: n, page: reference.page, count: example.frames.length });
}

function narrationMain(example, built) {
  const main = element("div", "narration-main");
  const position = view.position;
  if (position === 0) {
    renderRich(main.appendChild(element("p", "narration-text")), example.intro);
  } else {
    const paragraph = main.appendChild(element("p", "narration-text"));
    if (view.mode === "solve") {
      const mine = answers()[position - 1];
      if (mine) {
        const verdict = verdictFor(built.records[position - 1], mine.given, example);
        paragraph.appendChild(element("span", verdict.right ? "verdict-right" : "verdict-wrong", verdict.text));
        paragraph.appendChild(document.createTextNode(" "));
      }
    }
    paragraph.appendChild(renderRich(element("span"), built.narrations[position - 1]));
    const note = (example.notes || {})[position];
    if (note) renderRich(main.appendChild(element("p", "narration-note")), note);
  }
  const live = liveReference();
  if (live) renderRich(main.appendChild(element("p", "narration-prompt")), promptFor(example, built, live));
  return main;
}

function renderNarration() {
  const example = currentExample();
  const built = currentBuilt();
  const final = view.position === built.executed;
  dom.narration.textContent = "";
  dom.narration.classList.toggle("with-extras", final);
  dom.narration.classList.toggle("no-compare", final && !example.compare);
  dom.narration.appendChild(narrationMain(example, built));
  if (!final) return;
  if (example.compare) dom.narration.appendChild(compareBlock(example.compare));
  const extras = element("div", "narration-extras");
  extras.appendChild(takeawayBlock(fill(example.closing, TOTALS)));
  dom.narration.appendChild(extras);
}

function renderControls() {
  const total = totalSteps();
  const limit = maxIndex();
  dom.progress.textContent = fill(UI_TEXT.progress, { current: view.position + 1, total: total });
  dom.progressFill.style.transform = "scaleX(" + ((view.position + 1) / total) + ")";
  dom.first.disabled = view.position === 0;
  dom.prev.disabled = view.position === 0;
  dom.next.disabled = view.position >= limit;
  dom.last.disabled = view.position >= limit;
  dom.play.hidden = view.mode !== "watch";
  dom.play.textContent = view.playing ? UI_TEXT.pause : UI_TEXT.play;
  dom.restart.hidden = view.mode !== "solve";
  dom.restart.disabled = answeredCount() === 0;
  const given = answers();
  const right = given.filter(function (mine, index) { return mine.given === currentBuilt().answers[index]; }).length;
  dom.score.textContent = view.mode === "solve" && given.length > 0 ? fill(UI_TEXT.score, { ok: right, total: given.length }) : "";
}

function keepFocus(step) {
  const before = document.activeElement;
  const key = before && before.dataset ? before.dataset.focus : null;
  step();
  if (!key) return;
  const back = document.querySelector('[data-focus="' + key + '"]');
  if (back) back.focus();
}

function renderAll() {
  const example = currentExample();
  buildCanvas();
  dom.title.textContent = example.number + ". " + example.title;
  dom.subtitle.textContent = example.subtitle;
  dom.stepUnit.textContent = example.stepUnit;
  renderModes();
  renderHeaderChoices();
  updateExampleList();
  example.canvas.panels.forEach(function (id) { PANELS[id](); });
  renderNarration();
  renderControls();
}

function render() {
  keepFocus(renderAll);
}

function goTo(index) {
  view.position = Math.max(0, Math.min(index, maxIndex()));
  render();
  if (view.playing && view.position >= maxIndex()) stopPlaying();
}

function answer(given) {
  const live = liveReference();
  if (!live) return;
  const key = progressKey(view.exampleIndex, view.variantIndex);
  const list = answers().slice();
  list.push({ given: given });
  progress[key] = { answers: list };
  writeStore();
  view.position = list.length;
  render();
}

function restartExample() {
  stopPlaying();
  delete progress[progressKey(view.exampleIndex, view.variantIndex)];
  writeStore();
  view.position = 0;
  render();
}

function entryPosition() {
  return view.mode === "solve" ? answeredCount() : 0;
}

function selectExample(index) {
  stopPlaying();
  view.exampleIndex = index;
  view.variantIndex = 0;
  view.position = entryPosition();
  render();
}

function selectVariant(index) {
  if (index === view.variantIndex) return;
  stopPlaying();
  view.variantIndex = index;
  view.position = entryPosition();
  render();
}

function selectMode(mode) {
  if (mode === view.mode) return;
  stopPlaying();
  view.mode = mode;
  view.position = mode === "solve" ? answeredCount() : Math.min(view.position, currentBuilt().executed);
  render();
}

function stopPlaying() {
  view.playing = false;
  if (view.timer) { clearTimeout(view.timer); view.timer = null; }
  dom.play.textContent = UI_TEXT.play;
}

function scheduleTick() {
  if (view.timer) clearTimeout(view.timer);
  view.timer = setTimeout(function () {
    if (!view.playing) return;
    if (view.position >= maxIndex()) { stopPlaying(); render(); return; }
    goTo(view.position + 1);
    if (view.playing) scheduleTick();
  }, AUTOPLAY_DELAY);
}

function togglePlaying() {
  if (view.playing) { stopPlaying(); render(); return; }
  if (view.position >= maxIndex()) view.position = 0;
  view.playing = true;
  scheduleTick();
  render();
}

function lookupTooltip(key) {
  if (key.indexOf("panel:") === 0) return PANEL_TIPS[key.slice(6)];
  return TOOLTIPS[key];
}

function showTooltip(trigger, tip) {
  dom.tooltip.textContent = "";
  dom.tooltip.appendChild(element("strong", "tip-title", tip.title));
  dom.tooltip.appendChild(document.createTextNode(tip.body));
  dom.tooltip.classList.add("open");
  const box = trigger.getBoundingClientRect();
  const width = dom.tooltip.offsetWidth;
  const height = dom.tooltip.offsetHeight;
  let left = box.left + box.width / 2 - width / 2;
  left = Math.min(left, window.innerWidth - width - 8);
  let top = box.top - height - 8;
  if (top < 8) top = box.bottom + 8;
  dom.tooltip.style.left = Math.max(8, left) + "px";
  dom.tooltip.style.top = top + "px";
}

function hideTooltip() { dom.tooltip.classList.remove("open"); }

function closestElement(target, selector) {
  return target && typeof target.closest === "function" ? target.closest(selector) : null;
}

["mouseover", "focusin"].forEach(function (name) {
  document.addEventListener(name, function (event) {
    const trigger = closestElement(event.target, "[data-tip]");
    const tip = trigger ? lookupTooltip(trigger.dataset.tip) : null;
    if (tip) showTooltip(trigger, tip);
    else hideTooltip();
  });
});

["mouseout", "focusout", "scroll"].forEach(function (name) {
  document.addEventListener(name, hideTooltip, true);
});

dom.first.addEventListener("click", function () { stopPlaying(); goTo(0); });
dom.prev.addEventListener("click", function () { stopPlaying(); goTo(view.position - 1); });
dom.next.addEventListener("click", function () { stopPlaying(); goTo(view.position + 1); });
dom.last.addEventListener("click", function () { stopPlaying(); goTo(maxIndex()); });
dom.play.addEventListener("click", togglePlaying);
dom.restart.addEventListener("click", restartExample);

function answerByKey(key) {
  const example = currentExample();
  const digit = Number(key);
  if (!liveReference() || !(digit >= 1)) return false;
  if (example.algorithm === "tlb") {
    if (digit > TLB_OPTIONS.length) return false;
    answer(TLB_OPTIONS[digit - 1]);
    return true;
  }
  if (digit > example.frames.length) return false;
  answer(String(digit - 1));
  return true;
}

document.addEventListener("keydown", function (event) {
  if (event.target && event.target.tagName === "BUTTON" && (event.key === " " || event.key === "Enter")) return;
  if (event.metaKey || event.ctrlKey || event.altKey) return;
  if (event.key === "ArrowRight") { stopPlaying(); goTo(view.position + 1); event.preventDefault(); }
  if (event.key === "ArrowLeft") { stopPlaying(); goTo(view.position - 1); event.preventDefault(); }
  if (event.key === "Home") { stopPlaying(); goTo(0); event.preventDefault(); }
  if (event.key === "End") { stopPlaying(); goTo(maxIndex()); event.preventDefault(); }
  if (event.key === "Escape") hideTooltip();
  if (/^[1-9]$/.test(event.key) && answerByKey(event.key)) event.preventDefault();
});

dom.pageTitle.textContent = UI_TEXT.pageTitle;
dom.first.textContent = UI_TEXT.firstStep;
dom.prev.textContent = UI_TEXT.prevStep;
dom.next.textContent = UI_TEXT.nextStep;
dom.last.textContent = UI_TEXT.lastStep;
dom.play.textContent = UI_TEXT.play;
dom.restart.textContent = UI_TEXT.restart;

Object.keys(UI_TEXT.panels).forEach(function (id) {
  if (!PANELS[id]) console.error("El panel " + id + " tiene nombre pero no tiene dibujo");
});

Object.keys(PANELS).forEach(function (id) {
  if (!UI_TEXT.panels[id]) console.error("El panel " + id + " tiene dibujo pero no tiene nombre");
});

renderExampleList();
view.position = entryPosition();
render();
</script>
</body>
</html>
