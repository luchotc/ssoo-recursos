<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%227%22%20fill%3D%22%23b45309%22%2F%3E%3Crect%20x%3D%229.5%22%20y%3D%229.5%22%20width%3D%2213%22%20height%3D%2213%22%20rx%3D%222.5%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%222.4%22%2F%3E%3Cg%20stroke%3D%22%23fff%22%20stroke-width%3D%222.4%22%20stroke-linecap%3D%22round%22%3E%3Cpath%20d%3D%22M13%209.5V5M19%209.5V5M13%2027v-4.5M19%2027v-4.5M9.5%2013H5M9.5%2019H5M27%2013h-4.5M27%2019h-4.5%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">
<title>Sustitución de páginas</title>
<style>
  :root {
    --ink: #10151d;
    --ink-soft: #35404f;
    --muted: #5f6877;
    --faint: #6b7484;
    --line: #e3e7ee;
    --line-strong: #c6ccd8;
    --page: #edf0f6;
    --card: #ffffff;

    --running: #1d4ed8;
    --running-soft: #e8eefc;
    --fault: #c0392f;
    --fault-soft: #fbeae8;

    --marked: #1c2534;
    --marked-soft: #e3e8f1;
    --region-fill-alt: #f2f5f9;

    --radius: 11px;
    --shadow: 0 1px 2px rgba(16, 21, 29, 0.05), 0 1px 8px rgba(16, 21, 29, 0.04);
    --fast: 160ms;
  }

  * { box-sizing: border-box; }

  [hidden] { display: none !important; }

  html, body { margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.45;
    color: var(--ink);
    background: var(--page);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 9px;
    padding: 10px 14px 12px;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3 { margin: 0; font-weight: 640; }

  button {
    font: inherit;
    color: inherit;
    background: var(--card);
    border: 1px solid var(--line-strong);
    border-radius: 7px;
    cursor: pointer;
    transition: background-color var(--fast) ease-out, border-color var(--fast) ease-out, color var(--fast) ease-out, transform var(--fast) ease-out;
  }

  button:hover:not([disabled]) { border-color: var(--faint); }
  button:active:not([disabled]) { transform: translateY(1px); }

  button:focus-visible, [tabindex]:focus-visible {
    outline: 3px solid var(--marked);
    outline-offset: 2px;
  }

  button[disabled] { opacity: 0.4; cursor: not-allowed; }

  header { display: flex; flex-direction: column; gap: 8px; flex: 0 0 auto; }

  .head-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .head-row .spacer { flex: 1; }

  header > h1 { font-size: 16px; letter-spacing: -0.012em; color: var(--ink-soft); }

  .toggle-label { font-size: 12.5px; color: var(--muted); }

  .switch { display: flex; gap: 5px; flex-wrap: wrap; }
  .switch button { padding: 4px 12px; font-size: 12.5px; font-weight: 620; }
  .switch button[aria-pressed="true"] { background: var(--marked); border-color: var(--marked); color: #fff; }
  .tool-row .switch button { padding: 2px 8px; font-size: 11.5px; }

  .examples { display: flex; align-items: center; gap: 6px 0; flex-wrap: wrap; }
  .examples .group { display: inline-flex; align-items: center; gap: 6px; }

  .group-cap {
    font-size: 10.5px;
    font-weight: 750;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 0 4px 0 8px;
  }

  .examples > .group:first-child .group-cap { padding-left: 0; }

  .examples button {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 5px 8px;
    font-size: 12.5px;
    text-align: left;
    box-shadow: var(--shadow);
  }

  .examples button .num {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 19px;
    height: 19px;
    border-radius: 50%;
    background: var(--page);
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
  }

  .examples button .tick { width: 9px; font-size: 10px; font-weight: 800; color: var(--muted); visibility: hidden; }
  .examples button.solved .tick { visibility: visible; }
  .examples button[aria-current="true"] { background: var(--running); border-color: var(--running); color: #fff; }
  .examples button[aria-current="true"] .num { background: rgba(0, 0, 0, 0.22); color: #fff; }
  .examples button[aria-current="true"] .tick { color: #fff; }

  main {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-template-columns: 1fr;
    grid-template-rows: minmax(0, 1fr);
    gap: 9px;
  }

  .panel {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    min-height: 0;
    min-width: 0;
  }

  .panel > h2 {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 11px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--faint);
    padding: 9px 12px 8px;
    border-bottom: 1px solid var(--line);
    flex: 0 0 auto;
    min-height: 37px;
  }

  .panel > h2::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--line-strong);
    flex: 0 0 auto;
  }

  .panel.board > h2::before, .panel.tlbBoard > h2::before { background: var(--running); }
  .panel.state > h2::before { background: var(--ink-soft); }

  .panel > h2 .tip { border-bottom-color: var(--line); color: inherit; letter-spacing: inherit; text-transform: inherit; white-space: nowrap; }
  .panel > h2 .tip:hover { border-bottom-color: var(--faint); }

  .panel > h2 .panel-note {
    min-width: 0;
    text-transform: none;
    letter-spacing: 0;
    font-size: 10.5px;
    font-weight: 400;
    color: var(--muted);
  }

  .tool-row {
    display: flex;
    align-items: center;
    gap: 6px 8px;
    flex-wrap: wrap;
    margin: -3px 0 -3px auto;
    text-transform: none;
    letter-spacing: 0;
    font-weight: 400;
    color: var(--ink);
  }

  .tool-row .answer {
    padding: 3px 9px;
    font-size: 12px;
    font-weight: 650;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .tool-row .answer .key {
    font-size: 10.5px;
    font-weight: 750;
    color: var(--muted);
    border: 1px solid var(--line-strong);
    border-radius: 4px;
    padding: 0 4px;
    line-height: 1.35;
  }

  .panel-body {
    padding: 9px 11px;
    overflow: auto;
    min-height: 0;
    flex: 1 1 auto;
  }

  .panel-body.board-body { padding-top: 8px; padding-bottom: 7px; }
  .board-body { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 10px 22px; }

  .board-scroll { overflow-x: auto; flex: 0 1 auto; min-width: 0; max-width: 100%; padding: 3px 4px 3px 3px; }

  .grid { border-collapse: separate; border-spacing: 4px 3px; margin: -3px -4px; font-variant-numeric: tabular-nums; }

  .grid th, .grid td { padding: 0; }

  .grid .row-label {
    text-align: right;
    padding-right: 5px;
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    white-space: nowrap;
  }

  .grid .row-label.frame { color: var(--ink-soft); }

  .grid .col-index { font-size: 10.5px; font-weight: 650; color: var(--muted); text-align: center; height: 14px; line-height: 1.2; }

  .grid .col-page {
    min-width: 38px;
    height: 23px;
    font-size: 15px;
    font-weight: 750;
    text-align: center;
    color: var(--ink);
    border-radius: 6px;
  }

  .grid .col-address { font-size: 10.5px; font-weight: 650; color: var(--ink-soft); text-align: center; white-space: nowrap; height: 14px; line-height: 1.2; }

  .grid .col-head.current { background: var(--marked-soft); }
  .grid .col-head.skipped { color: var(--muted); text-decoration: line-through; }
  .grid .col-head.live { box-shadow: inset 0 -3px 0 var(--marked); }

  .grid .initial-head { font-size: 10.5px; font-weight: 700; color: var(--muted); text-align: center; letter-spacing: 0.03em; }

  .cell {
    min-width: 38px;
    height: 30px;
    border: 1.5px solid var(--line-strong);
    border-radius: 6px;
    text-align: center;
    vertical-align: middle;
    font-size: 15px;
    font-weight: 700;
    line-height: 1;
    padding: 2px 3px;
    background: var(--card);
  }

  .cell.empty { border-style: dashed; border-color: var(--line-strong); color: var(--muted); }
  .cell.future { border-style: dashed; border-color: var(--line); background: transparent; }
  .cell.skipped { border-color: var(--line); background: var(--region-fill-alt); color: var(--muted); font-size: 12px; }
  .cell.initial { background: var(--region-fill-alt); }
  .cell.fresh { border-color: var(--marked); box-shadow: inset 0 0 0 2px var(--marked); }
  .cell .bits { display: block; font-size: 10px; font-weight: 650; color: var(--ink-soft); letter-spacing: 0.02em; margin-top: 2px; }
  .cell .ptr { font-size: 9px; color: var(--ink); margin-right: 2px; vertical-align: 2px; }
  .grid.compact { border-spacing: 4px 2px; margin: -2px -4px; }
  .grid.compact .cell { height: 20px; font-size: 13.5px; padding: 1px 3px; }
  .grid.compact .col-page { height: 21px; }

  .cell.live { padding: 0; border: 0; background: transparent; }

  .pick {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-width: 38px;
    height: 30px;
    border: 1.5px dashed var(--ink-soft);
    border-radius: 6px;
    padding: 2px 3px;
    font-size: 15px;
    font-weight: 700;
    line-height: 1;
    background: var(--card);
    color: var(--muted);
    box-shadow: none;
  }

  .pick .then { color: var(--muted); }
  .pick .ghost { display: none; color: var(--ink); }
  .pick:hover:not([disabled]), .pick:focus-visible { background: var(--marked-soft); border-style: solid; border-color: var(--marked); }
  .pick:hover .then, .pick:focus-visible .then { display: none; }
  .pick:hover .ghost, .pick:focus-visible .ghost { display: inline; }
  .pick .bits { display: block; font-size: 10px; font-weight: 650; color: var(--muted); margin-top: 2px; }

  .mark-cell { height: 17px; line-height: 1.2; min-width: 38px; text-align: center; font-size: 12.5px; font-weight: 750; color: var(--ink-soft); }
  .mark-cell.fault { color: var(--fault); font-weight: 800; }
  .mark-cell.small { font-size: 10px; letter-spacing: 0.01em; }
  .mark-cell.wrong { color: var(--fault); font-size: 14px; }
  .mark-cell.right { color: var(--ink-soft); font-size: 14px; }

  .grid tr.split > * { padding-top: 4px; }

  .legend { display: flex; flex-direction: column; gap: 5px; flex: 1 1 150px; min-width: 150px; max-width: 250px; padding-top: 4px; }
  .legend .item { display: flex; align-items: baseline; gap: 7px; font-size: 11px; line-height: 1.3; color: var(--muted); }
  .legend .item > :first-child { flex: 0 0 auto; min-width: 22px; }
  .legend .token { font-size: 11px; font-weight: 800; color: var(--ink-soft); white-space: nowrap; }
  .legend .token.fault { color: var(--fault); }
  .legend .ring { width: 22px; height: 14px; border-radius: 4px; border: 1.5px solid var(--marked); box-shadow: inset 0 0 0 1.5px var(--marked); align-self: center; }

  .state-body { display: flex; flex-direction: column; gap: 10px; }

  .when { margin: 0 0 -3px; font-size: 12.5px; font-weight: 700; color: var(--ink-soft); display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }

  .counters { display: flex; flex-wrap: wrap; gap: 8px; }

  .counter {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    border: 2px solid var(--ink);
    border-radius: 8px;
    padding: 3px 9px;
  }

  .counter .caption { font-size: 10px; letter-spacing: 0.05em; text-transform: uppercase; font-weight: 750; color: var(--muted); }
  .counter .value { font-size: 18px; font-weight: 750; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .counter .pair { display: inline-flex; align-items: center; gap: 5px; }
  .counter .pair + .pair { margin-left: 5px; }
  .counter .pair.fresh .value { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }
  .counter.fresh { box-shadow: 0 0 0 2px var(--marked); }

  .sub-title { font-size: 11px; letter-spacing: 0.07em; text-transform: uppercase; font-weight: 750; color: var(--faint); margin-bottom: 6px; }

  .frame-list { display: flex; flex-direction: column; gap: 5px; }

  .frame-row { display: grid; grid-template-columns: 58px 38px minmax(0, 1fr); align-items: center; gap: 9px; }
  .frame-row .who { font-size: 12.5px; font-weight: 700; color: var(--ink-soft); white-space: nowrap; }

  .frame-row .page {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 28px;
    border: 1.5px solid var(--ink-soft);
    border-radius: 6px;
    font-size: 15px;
    font-weight: 750;
    font-variant-numeric: tabular-nums;
  }

  .frame-row .page.free { border-style: dashed; border-color: var(--line-strong); color: var(--muted); font-size: 10.5px; font-weight: 650; }
  .frame-row .page.fresh { border-color: var(--marked); box-shadow: inset 0 0 0 2px var(--marked); }

  .order { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 4px; }
  .order .arrow { font-size: 12px; color: var(--muted); }
  .order .empty { font-size: 12px; color: var(--muted); }

  .chip {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    min-width: 46px;
    border: 1.5px solid var(--ink-soft);
    border-radius: 6px;
    padding: 2px 6px 3px;
  }

  .chip .value { font-size: 15px; font-weight: 750; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .chip .caption { font-size: 10.5px; color: var(--muted); white-space: nowrap; }
  .chip.fresh { border-color: var(--marked); box-shadow: inset 0 0 0 2px var(--marked); }

  .frame-row .info { font-size: 12.5px; color: var(--ink-soft); line-height: 1.3; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; }
  .frame-row .ptr-tag { font-size: 11px; font-weight: 800; color: var(--ink); white-space: nowrap; }

  .hidden-note { font-size: 12px; color: var(--muted); margin: 0; }
  .ended { font-size: 11.5px; font-weight: 750; color: var(--fault); border: 1.5px solid var(--fault); background: var(--fault-soft); border-radius: 5px; padding: 2px 8px; }

  footer { flex: 0 0 auto; display: block; min-height: 0; }

  .narration-panel { display: flex; flex-direction: column; min-height: 0; height: 100%; }

  .narration-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
    padding: 8px 12px 7px;
    border-bottom: 1px solid var(--line);
  }

  .narration-head .title { font-weight: 660; font-size: 14.5px; }
  .narration-head .subtitle { font-size: 13px; color: var(--muted); flex: 1; min-width: 160px; }

  .step-unit {
    font-size: 11px;
    color: var(--muted);
    background: var(--page);
    border-radius: 5px;
    padding: 2px 7px;
    white-space: nowrap;
  }

  .narration-body {
    padding: 9px 12px 4px;
    flex: 1 1 auto;
    min-height: 113px;
    max-height: 170px;
    overflow-y: auto;
  }

  .narration-body.with-extras {
    display: grid;
    grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.1fr) minmax(300px, 0.85fr);
    gap: 6px 18px;
    align-content: start;
  }

  .narration-body.with-extras.no-compare { grid-template-columns: minmax(0, 1fr) minmax(280px, 0.7fr); }

  .narration-extras { min-width: 0; min-height: 0; overflow-y: auto; }
  .narration-main { min-width: 0; }

  .narration-text { font-size: 15.5px; margin: 0; color: var(--ink); }
  .narration-note { font-size: 13.5px; color: var(--muted); margin: 4px 0 0; }
  .narration-prompt { font-size: 13.5px; color: var(--ink-soft); margin: 6px 0 0; padding-left: 9px; border-left: 3px solid var(--marked); }
  .verdict-right { font-weight: 750; }
  .verdict-wrong { font-weight: 750; color: var(--fault); }

  .takeaway {
    padding: 7px 11px;
    border: 2px solid var(--ink);
    border-radius: 8px;
    animation: flash var(--fast) ease-out;
  }

  .takeaway .tag {
    display: block;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 800;
    color: var(--muted);
    margin-bottom: 2px;
  }

  .takeaway .line { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }

  .compare { margin: 7px 0 0; overflow-x: auto; }
  .compare.full { grid-column: 2; grid-row: 1; margin: 0; }
  .compare table { border-collapse: collapse; font-size: 12.5px; line-height: 1.3; font-variant-numeric: tabular-nums; }
  .compare th { text-align: left; font-size: 10.5px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--faint); font-weight: 700; padding: 0 16px 4px 0; }
  .compare td { padding: 2px 16px 2px 0; vertical-align: top; }
  .compare tr + tr td { border-top: 1px solid var(--line); }
  .compare td.label { color: var(--muted); }

  .progress-row { display: flex; align-items: center; gap: 10px; padding: 4px 12px 0; }

  .progress-track { flex: 1; height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }

  .progress-fill {
    height: 100%;
    background: var(--running);
    border-radius: 2px;
    transition: transform var(--fast) ease-out;
    transform-origin: left center;
  }

  .progress { font-size: 12px; line-height: 1.2; color: var(--muted); white-space: nowrap; }

  .controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 7px 12px 8px; }
  .controls .spacer { flex: 1; }

  .controls .big { padding: 7px 16px; font-size: 15px; font-weight: 640; }

  .controls .big.primary { background: var(--running); border-color: var(--running); color: #fff; }
  .controls .big.primary:hover:not([disabled]) { background: #1a45bd; border-color: #1a45bd; }
  .controls .big.primary[disabled] { background: var(--running); border-color: var(--running); }
  .controls .small { padding: 6px 11px; font-size: 13px; }

  .score { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .tip {
    font: inherit;
    background: none;
    border: 0;
    padding: 0;
    color: inherit;
    border-bottom: 1px dotted var(--running);
    cursor: help;
    border-radius: 0;
  }

  .tip:hover { border-bottom-style: solid; }

  #tooltip {
    position: fixed;
    z-index: 20;
    max-width: 330px;
    background: var(--ink);
    color: #fff;
    border-radius: 8px;
    padding: 9px 11px;
    font-size: 13px;
    line-height: 1.42;
    box-shadow: 0 6px 20px rgba(16, 21, 29, 0.3);
    display: none;
  }

  #tooltip.open { display: block; animation: flash var(--fast) ease-out; }
  #tooltip .tip-title { font-weight: 700; display: block; margin-bottom: 3px; }

  @keyframes flash {
    from { opacity: 0.35; }
    to { opacity: 1; }
  }

  @media (max-width: 1239px) {
    body { height: auto; overflow: auto; }
    main { grid-template-columns: 1fr !important; grid-template-rows: none !important; }
    .panel-body { overflow: visible; }
    .board-scroll { overflow-x: auto; }
    .narration-body { overflow: visible; max-height: none; }
  }

  @media (max-width: 1000px) {
    body { padding-bottom: calc(122px + env(safe-area-inset-bottom)); }
    .narration-body.with-extras, .narration-body.with-extras.no-compare { grid-template-columns: 1fr; }
    .compare.full { grid-column: auto; grid-row: auto; margin: 7px 0 0; }
    .narration-extras { overflow: visible; }
    .narration-head { flex-direction: column; align-items: flex-start; gap: 3px; }
    .panel > h2 { flex-wrap: wrap; }
    .tool-row { margin: 2px 0 0; width: 100%; }

    .controls {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
      padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
      background: var(--card);
      border-top: 1px solid var(--line-strong);
      box-shadow: 0 -2px 12px rgba(16, 21, 29, 0.08);
      z-index: 10;
    }

    .controls .big, .controls .small { width: 100%; }
    .controls .spacer, .controls .score { display: none; }
    #playPause { display: none; }
    #restartExample { display: none; }
    #prevStep { order: 1; }
    #nextStep { order: 2; }
    #firstStep { order: 3; }
    #lastStep { order: 4; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {

<script id="engine">
const USED_TIPS = {};
const REFERENCE_ORDER_BASE = 1000000;
const CLOCK_ALGORITHMS = { clock: true, clockModified: true };
const FAULT_KINDS = { load: true, replace: true, fault: true };
const ALGORITHMS = { fifo: true, optimal: true, lru: true, clock: true, clockModified: true, tlb: true };

function fill(template, values) {
  return String(template).replace(/\{(\w+)\}/g, function (whole, key) {
    return values[key] === undefined ? whole : String(values[key]);
  });
}

function joinList(items) {
  if (items.length <= 1) return items.join("");
  return items.slice(0, -1).join(", ") + UI_TEXT.and + items[items.length - 1];
}

function unresolved(text) {
  return /\{\w+\}/.test(String(text));
}

function unbalanced(text) {
  const stars = String(text).split("*").length - 1;
  const opens = String(text).split("[[").length - 1;
  const closes = String(text).split("]]").length - 1;
  return stars % 2 !== 0 || opens !== closes;
}

function collectTipKeys(text, into) {
  const pattern = /\[\[(\w+):/g;
  let match = pattern.exec(text);
  while (match) {
    into[match[1]] = true;
    match = pattern.exec(text);
  }
}

function copyState(state) {
  return JSON.parse(JSON.stringify(state));
}

function isClock(example) {
  return Boolean(CLOCK_ALGORITHMS[example.algorithm]);
}

function normalizeReference(example, raw, problems, n) {
  if (typeof raw === "number") return { page: raw };
  const page = Math.floor(raw.address / example.pageSize);
  const offset = raw.address % example.pageSize;
  if (page !== raw.page) problems.push("la referencia " + n + " declara la página " + raw.page + " y la dirección da " + page);
  if (offset !== raw.offset) problems.push("la referencia " + n + " declara el desplazamiento " + raw.offset + " y la dirección da " + offset);
  return { page: page, offset: offset, address: raw.address, mode: raw.mode };
}

function touch(frame, n) {
  frame.order = REFERENCE_ORDER_BASE + n;
  frame.lastText = fill(UI_TEXT.state.lastRef, { n: n });
  frame.lastNarr = fill(UI_TEXT.narr.lastRef, { n: n });
}

function initialState(example, problems) {
  const frames = example.frames.map(function (label) {
    return { label: label, page: null, u: 0, m: 0, order: null, lastText: null, lastNarr: null, since: null };
  });
  const initial = example.initial || { frames: [] };
  initial.frames.forEach(function (item) {
    const position = example.frames.indexOf(item.frame);
    if (position === -1) { problems.push("el estado inicial usa el marco " + item.frame + ", que no existe"); return; }
    const frame = frames[position];
    frame.page = item.page;
    frame.u = item.u || 0;
    frame.m = item.m || 0;
    frame.order = item.instant;
    frame.lastText = fill(UI_TEXT.state.lastInstant, { t: item.instant });
    frame.lastNarr = fill(UI_TEXT.narr.lastInstant, { t: item.instant });
  });
  let pointer = 0;
  if (initial.pointer !== undefined) {
    pointer = example.frames.indexOf(initial.pointer);
    if (pointer === -1) { problems.push("el puntero inicial apunta a un marco que no existe"); pointer = 0; }
  }
  const tlb = example.tlbSize ? Array.apply(null, Array(example.tlbSize)).map(function () { return null; }) : null;
  return { frames: frames, pointer: pointer, tlb: tlb, counters: { faults: 0, writes: 0, tlb: 0, memory: 0, disk: 0 }, terminated: false };
}

function nextUseOf(references, page, after) {
  for (let index = after; index < references.length; index += 1) {
    if (references[index].page === page) return index + 1;
  }
  return null;
}

function fifoVictim(frames) {
  let best = 0;
  frames.forEach(function (frame, index) { if (frame.since < frames[best].since) best = index; });
  return { index: best };
}

function optimalVictim(frames, references, n) {
  let best = 0;
  let bestUse = -1;
  const uses = frames.map(function (frame, index) {
    const at = nextUseOf(references, frame.page, n);
    const distance = at === null ? Infinity : at;
    if (distance > bestUse) { bestUse = distance; best = index; }
    return { page: frame.page, at: at };
  });
  return { index: best, uses: uses };
}

function lruVictim(frames) {
  let best = 0;
  frames.forEach(function (frame, index) { if (frame.order < frames[best].order) best = index; });
  return { index: best };
}

function clockVictim(frames, pointer) {
  const cleared = [];
  let at = pointer;
  while (frames[at].u === 1) {
    frames[at].u = 0;
    cleared.push(at);
    at = (at + 1) % frames.length;
  }
  return { index: at, start: pointer, cleared: cleared };
}

function clockModifiedVictim(frames, pointer) {
  const passes = [];
  for (let round = 0; round < 4; round += 1) {
    const dirty = round % 2 === 1;
    const cleared = [];
    for (let step = 0; step < frames.length; step += 1) {
      const index = (pointer + step) % frames.length;
      const frame = frames[index];
      if (frame.u === 0 && frame.m === (dirty ? 1 : 0)) {
        passes.push({ dirty: dirty, found: index, cleared: cleared });
        return { index: index, start: pointer, passes: passes };
      }
      if (dirty && frame.u === 1) { frame.u = 0; cleared.push(index); }
    }
    passes.push({ dirty: dirty, found: null, cleared: cleared });
  }
  return { index: pointer, start: pointer, passes: passes };
}

function freeFrame(example, state) {
  const frames = state.frames;
  if (!isClock(example)) return frames.findIndex(function (frame) { return frame.page === null; });
  for (let step = 0; step < frames.length; step += 1) {
    const index = (state.pointer + step) % frames.length;
    if (frames[index].page === null) return index;
  }
  return -1;
}

function chooseVictim(example, state, references, n) {
  if (example.algorithm === "fifo") return fifoVictim(state.frames);
  if (example.algorithm === "optimal") return optimalVictim(state.frames, references, n);
  if (example.algorithm === "lru" || example.algorithm === "tlb") return lruVictim(state.frames);
  if (example.algorithm === "clock") return clockVictim(state.frames, state.pointer);
  return clockModifiedVictim(state.frames, state.pointer);
}

function stepFrames(example, state, references, n, problems) {
  const next = copyState(state);
  const reference = references[n - 1];
  const record = { n: n, page: reference.page, offset: reference.offset, address: reference.address, mode: reference.mode, write: reference.mode === "E" };
  if (example.processPages !== undefined && reference.page >= example.processPages) {
    record.kind = "invalid";
    next.terminated = true;
    return { record: record, state: next };
  }
  const frames = next.frames;
  const at = frames.findIndex(function (frame) { return frame.page === reference.page; });
  if (at !== -1) {
    record.kind = "hit";
    record.frame = at;
    frames[at].u = 1;
    if (record.write) frames[at].m = 1;
    touch(frames[at], n);
    record.pointer = next.pointer;
    return { record: record, state: next };
  }
  next.counters.faults += 1;
  const free = freeFrame(example, next);
  if (free !== -1) {
    record.kind = "load";
    record.frame = free;
    if (isClock(example) && free !== next.pointer) problems.push("en la referencia " + n + " el marco libre no es el del puntero");
  } else {
    const choice = chooseVictim(example, next, references, n);
    const victim = frames[choice.index];
    record.kind = "replace";
    record.frame = choice.index;
    record.victim = victim.page;
    record.victimSince = victim.since;
    record.victimLast = victim.lastNarr;
    record.uses = choice.uses;
    record.cleared = choice.cleared;
    record.passes = choice.passes;
    record.start = choice.start;
    record.written = victim.m === 1;
    if (record.written) next.counters.writes += 1;
  }
  const target = frames[record.frame];
  target.page = reference.page;
  target.u = 1;
  target.m = record.write ? 1 : 0;
  target.since = n;
  touch(target, n);
  if (isClock(example)) next.pointer = (record.frame + 1) % frames.length;
  record.pointer = next.pointer;
  return { record: record, state: next };
}

function insertIntoTlb(state, page, n, record) {
  let slot = state.tlb.findIndex(function (entry) { return entry === null; });
  if (slot === -1) {
    slot = 0;
    state.tlb.forEach(function (entry, index) { if (entry.since < state.tlb[slot].since) slot = index; });
    record.tlbOld = state.tlb[slot].page;
  }
  state.tlb[slot] = { page: page, since: n };
  record.slot = slot;
}

function addCosts(counters, cost) {
  counters.tlb += cost.tlb;
  counters.memory += cost.memory;
  counters.disk += cost.disk;
}

function stepTlb(example, state, references, n) {
  const next = copyState(state);
  const page = references[n - 1].page;
  const record = { n: n, page: page };
  const frames = next.frames;
  const slot = next.tlb.findIndex(function (entry) { return entry !== null && entry.page === page; });
  const at = frames.findIndex(function (frame) { return frame.page === page; });
  if (slot !== -1) {
    record.kind = "tlb";
    record.frame = at;
    record.slot = slot;
    touch(frames[at], n);
  } else if (at !== -1) {
    record.kind = "table";
    record.frame = at;
    touch(frames[at], n);
    insertIntoTlb(next, page, n, record);
  } else {
    record.kind = "fault";
    next.counters.faults += 1;
    let target = frames.findIndex(function (frame) { return frame.page === null; });
    if (target === -1) {
      target = lruVictim(frames).index;
      record.victim = frames[target].page;
      const stale = next.tlb.findIndex(function (entry) { return entry !== null && entry.page === record.victim; });
      if (stale !== -1) { next.tlb[stale] = null; record.invalidated = record.victim; }
    }
    record.frame = target;
    frames[target].page = page;
    frames[target].since = n;
    touch(frames[target], n);
    insertIntoTlb(next, page, n, record);
  }
  addCosts(next.counters, example.costs[record.kind]);
  return { record: record, state: next };
}

function describeClock(record, example) {
  const narr = UI_TEXT.narr;
  const labels = example.frames;
  let text = fill(narr.clockStart, { start: labels[record.start] });
  if (record.cleared.length > 0) {
    const list = joinList(record.cleared.map(function (index) { return labels[index]; }));
    const template = record.cleared.length === labels.length ? narr.clockClearAll : record.cleared.length === 1 ? narr.clockClearOne : narr.clockClearMany;
    text += fill(template, { frames: list });
  }
  text += fill(narr.clockPick, { frame: labels[record.frame], victim: record.victim });
  return text;
}

function describeClockModified(record, example) {
  const narr = UI_TEXT.narr;
  const labels = example.frames;
  let text = fill(narr.clockStart, { start: labels[record.start] });
  record.passes.forEach(function (pass, round) {
    const name = narr.rounds[round];
    if (pass.found === null) {
      text += fill(pass.dirty ? narr.passNoneDirty : narr.passNoneClean, { round: name });
      return;
    }
    const values = { round: name, frame: labels[pass.found], victim: record.victim };
    if (!pass.dirty) { text += fill(narr.passFoundClean, values); return; }
    if (pass.cleared.length === 0) { text += fill(narr.passFoundDirty, values); return; }
    const list = joinList(pass.cleared.map(function (index) { return labels[index]; }));
    values.cleared = fill(pass.cleared.length === 1 ? narr.clearedOne : narr.clearedMany, { frames: list });
    text += fill(narr.passFoundDirtyCleared, values);
  });
  return text;
}

function describeReplacement(record, example) {
  const narr = UI_TEXT.narr;
  if (example.algorithm === "fifo") return fill(narr.fifo, { victim: record.victim, since: record.victimSince });
  if (example.algorithm === "optimal") {
    const uses = joinList(record.uses.map(function (use) {
      return use.at === null ? fill(narr.optimalNever, { page: use.page }) : fill(narr.optimalUse, { page: use.page, at: use.at });
    }));
    return fill(narr.optimal, { uses: uses, victim: record.victim });
  }
  if (example.algorithm === "lru") return fill(narr.lru, { victim: record.victim, last: record.victimLast });
  if (example.algorithm === "clock") return describeClock(record, example);
  return describeClockModified(record, example);
}

function describeHitSuffix(record, example) {
  const narr = UI_TEXT.narr;
  let text = "";
  if (example.algorithm === "fifo") text += narr.hitFifo;
  if (example.algorithm === "optimal") text += narr.hitOptimal;
  if (example.algorithm === "lru") text += narr.hitLru;
  if (isClock(example)) text += narr.hitClock;
  if (record.write) text += narr.hitWrite;
  return text;
}

function describeTlb(record, example) {
  const narr = UI_TEXT.narr;
  const cost = example.costs[record.kind];
  const values = { page: record.page, frame: example.frames[record.frame], tlb: cost.tlb, memory: cost.memory, disk: cost.disk };
  values.tlbOut = record.invalidated !== undefined
    ? fill(narr.tlbOutInvalidated, { victim: record.invalidated })
    : record.tlbOld !== undefined ? fill(narr.tlbOutFifo, { old: record.tlbOld }) : "";
  values.memOut = record.victim !== undefined ? fill(narr.memOut, { victim: record.victim }) : "";
  if (record.kind === "tlb") return fill(narr.tlbHit, values);
  if (record.kind === "table") return fill(narr.tlbTable, values);
  return fill(narr.tlbFault, values);
}

function capitalizeAfterStop(prefix, body) {
  if (!/\.\s*$/.test(prefix)) return prefix + body;
  return prefix + body.charAt(0).toUpperCase() + body.slice(1);
}

function describeRecord(record, example) {
  const prefix = record.address !== undefined
    ? fill(UI_TEXT.narr.prefixAddress, { n: record.n, address: record.address, modeName: UI_TEXT.narr.modeName[record.mode], page: record.page, offset: record.offset })
    : fill(UI_TEXT.narr.prefix, { n: record.n });
  return capitalizeAfterStop(prefix, describeBody(record, example));
}

function describeBody(record, example) {
  const narr = UI_TEXT.narr;
  const labels = example.frames;
  if (example.algorithm === "tlb") return describeTlb(record, example);
  if (record.kind === "invalid") {
    return fill(narr.invalid, { pages: example.processPages, lastPage: example.processPages - 1 });
  }
  if (record.kind === "hit") return fill(narr.hit, { page: record.page, frame: labels[record.frame] }) + describeHitSuffix(record, example);
  if (record.kind === "load") {
    const body = isClock(example)
      ? fill(narr.loadClock, { page: record.page, frame: labels[record.frame], next: labels[record.pointer] })
      : fill(narr.load, { page: record.page, frame: labels[record.frame] });
    return body + (record.write ? fill(narr.loadWrite, { page: record.page }) : "");
  }
  let text = fill(narr.replace, { page: record.page }) + describeReplacement(record, example);
  if (example.bits && example.bits.indexOf("m") !== -1) text += fill(record.written ? narr.written : narr.notWritten, { victim: record.victim });
  if (isClock(example)) return text + fill(record.write ? narr.clockEnterWrite : narr.clockEnter, { page: record.page, next: labels[record.pointer] });
  if (record.write) text += fill(narr.loadWrite, { page: record.page });
  return text;
}

function correctAnswer(record, example) {
  if (example.algorithm === "tlb") return record.kind;
  if (record.kind === "invalid") return "invalid";
  return String(record.frame);
}

function simulate(example, problems) {
  const references = example.references.map(function (raw, index) { return normalizeReference(example, raw, problems, index + 1); });
  const states = [initialState(example, problems)];
  const records = [];
  for (let n = 1; n <= references.length; n += 1) {
    const before = states[states.length - 1];
    if (before.terminated) break;
    const result = example.algorithm === "tlb"
      ? stepTlb(example, before, references, n)
      : stepFrames(example, before, references, n, problems);
    records.push(result.record);
    states.push(result.state);
  }
  return { references: references, records: records, states: states };
}

function verifyExpect(example, simulation, problems) {
  const expect = example.expect || {};
  const final = simulation.states[simulation.states.length - 1].counters;
  if (expect.faults === undefined) problems.push("no declara cuántos fallos espera");
  if (expect.faults !== undefined && final.faults !== expect.faults) problems.push("espera " + expect.faults + " fallos y la simulación da " + final.faults);
  if (expect.writes !== undefined && final.writes !== expect.writes) problems.push("espera " + expect.writes + " escrituras y la simulación da " + final.writes);
  ["tlb", "memory", "disk"].forEach(function (key) {
    if (expect[key] !== undefined && final[key] !== expect[key]) problems.push("espera " + expect[key] + " accesos de tipo " + key + " y la simulación da " + final[key]);
  });
  const victims = simulation.records.filter(function (record) { return record.victim !== undefined; }).map(function (record) { return record.victim; });
  if (expect.victims && expect.victims.join(",") !== victims.join(",")) problems.push("espera que salgan " + expect.victims.join(", ") + " y la simulación saca " + victims.join(", "));
}

function verifyStructure(example, problems) {
  if (!ALGORITHMS[example.algorithm]) problems.push("usa el algoritmo " + example.algorithm + ", que no existe");
  if (!example.closing) problems.push("no tiene frase de cierre");
  if (!example.stepUnit) problems.push("no declara la unidad del paso");
  if (!example.intro) problems.push("no tiene presentación");
  if (!example.frames || example.frames.length === 0) problems.push("no declara marcos");
  if (example.frames && example.frames.length > 9) problems.push("tiene más de 9 marcos y las teclas no alcanzan");
  example.canvas.panels.forEach(function (id) {
    if (!UI_TEXT.panels[id]) problems.push("usa el panel " + id + ", que no tiene nombre");
    if (!PANEL_TIPS[id]) problems.push("usa el panel " + id + ", que no tiene globito");
  });
  if (example.algorithm === "tlb" && !example.costs) problems.push("cuenta accesos y no declara cuánto cuesta cada caso");
  if (example.invalidOption && example.processPages === undefined) problems.push("ofrece dirección inválida y no dice cuántas páginas tiene el proceso");
  Object.keys(example.notes || {}).forEach(function (key) {
    if (Number(key) < 1 || Number(key) > example.references.length) problems.push("tiene una nota para la referencia " + key + ", que no existe");
  });
}

function textPieces(example, built) {
  const pieces = [{ where: "presentación", text: example.intro }];
  Object.keys(example.notes || {}).forEach(function (key) { pieces.push({ where: "nota de la referencia " + key, text: example.notes[key] }); });
  built.narrations.forEach(function (text, index) { pieces.push({ where: "narración de la referencia " + (index + 1), text: text }); });
  return pieces;
}

function verifyPieces(pieces, problems) {
  pieces.forEach(function (piece) {
    if (unresolved(piece.text)) problems.push("quedó un dato sin completar en la " + piece.where);
    if (unbalanced(piece.text)) problems.push("quedó una marca sin cerrar en la " + piece.where);
    const keys = {};
    collectTipKeys(piece.text, keys);
    Object.keys(keys).forEach(function (key) {
      if (!TOOLTIPS[key]) problems.push("la " + piece.where + " pide el globito " + key + ", que no existe");
      USED_TIPS[key] = true;
    });
  });
}

function buildVariant(example, label) {
  const problems = [];
  verifyStructure(example, problems);
  const simulation = simulate(example, problems);
  verifyExpect(example, simulation, problems);
  const narrations = simulation.records.map(function (record) { return describeRecord(record, example); });
  const built = {
    label: label,
    example: example,
    references: simulation.references,
    records: simulation.records,
    states: simulation.states,
    narrations: narrations,
    executed: simulation.records.length,
    answers: simulation.records.map(function (record) { return correctAnswer(record, example); }),
    problems: problems
  };
  verifyPieces(textPieces(example, built), problems);
  built.problems = problems.map(function (problem) { return label ? label + ": " + problem : problem; });
  return built;
}

function buildExample(example) {
  if (!example.variants) {
    const built = buildVariant(example, null);
    return { example: example, variants: [built], problems: built.problems.slice() };
  }
  const built = example.variants.map(function (variant) {
    const merged = Object.assign({}, example, variant);
    delete merged.variants;
    return buildVariant(merged, variant.variantLabel);
  });
  const problems = [];
  built.forEach(function (one) { one.problems.forEach(function (problem) { problems.push(problem); }); });
  if (!example.variantLabel) problems.push("tiene variantes y no dice cómo se llama el selector");
  if (example.variants.length < 2) problems.push("declara variantes y tiene menos de dos");
  const labels = example.variants.map(function (variant) { return variant.variantLabel; });
  if (new Set(labels).size !== labels.length) problems.push("hay dos variantes con el mismo nombre");
  return { example: example, variants: built, problems: problems };
}

const BUILT_EXAMPLES = EXAMPLES.map(buildExample);

function totalsContext() {
  const context = {};
  BUILT_EXAMPLES.forEach(function (entry) {
    entry.variants.forEach(function (built, index) {
      const counters = built.states[built.states.length - 1].counters;
      const suffixes = index === 0 ? ["_" + entry.example.number, "_" + entry.example.number + "_1"] : ["_" + entry.example.number + "_" + (index + 1)];
      suffixes.forEach(function (suffix) {
        context["fallos" + suffix] = counters.faults;
        context["escrituras" + suffix] = counters.writes;
        context["tlb" + suffix] = counters.tlb;
        context["memoria" + suffix] = counters.memory;
        context["disco" + suffix] = counters.disk;
      });
    });
  });
  return context;
}

const TOTALS = totalsContext();

BUILT_EXAMPLES.forEach(function (entry) {
  const example = entry.example;
  const pieces = [{ where: "frase de cierre", text: fill(example.closing, TOTALS) }];
  if (example.compare) {
    example.compare.headers.forEach(function (text) { pieces.push({ where: "encabezado de la tabla", text: fill(text, TOTALS) }); });
    example.compare.rows.forEach(function (row) {
      row.forEach(function (text) { pieces.push({ where: "celda de la tabla", text: fill(text, TOTALS) }); });
    });
  }
  verifyPieces(pieces, entry.problems);
});

(function verifyGroupsAreContiguous() {
  const seen = [];
  EXAMPLES.forEach(function (example) {
    if (seen[seen.length - 1] === example.group) return;
    if (seen.indexOf(example.group) !== -1) console.error("El grupo " + example.group + " aparece cortado en dos tramos de la escalera");
    seen.push(example.group);
  });
  EXAMPLES.forEach(function (example) {
    if (!UI_TEXT.groups[example.group]) console.error("El grupo " + example.group + " no tiene nombre");
  });
})();

BUILT_EXAMPLES.forEach(function (built) {
  built.problems.forEach(function (problem) {
    console.error("Ejemplo " + built.example.number + ": " + problem);
  });
});

Object.keys(TOOLTIPS).forEach(function (key) {
  if (!USED_TIPS[key]) console.error("El globito " + key + " está escrito y ninguna narración lo invoca");
});
